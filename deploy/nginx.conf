# /etc/nginx/sites-available/nobi
#
# nginx in front of the Nobi dashboard. Load-bearing rules:
#
# 1. Every proxy location must forward X-Forwarded-For and X-Forwarded-Proto.
#    nginx does NOT inherit server-level proxy_set_header directives into a
#    location that defines any proxy_set_header of its own. The app needs these
#    to identify the real client and to mark session cookies Secure.
#
# 2. Security headers are repeated in locations that add Cache-Control, because
#    nginx add_header inheritance is also all-or-nothing per level.
#
# 3. TLS only, no plain HTTP except the redirect. The token/cookie is a bearer
#    credential: over HTTP it is public.
#
# Enable:  sudo ln -s /etc/nginx/sites-available/nobi /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Cert:    sudo certbot --nginx -d nobi.example.ir   (Let's Encrypt)

log_format nobi '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" rt=$request_time';

upstream nobi_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nobi.example.ir;

    # ACME stays on plain HTTP; everything else is pushed to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # HTTP/2 is enabled on the listen line on purpose: the `http2 on;`
    # directive only exists in nginx >= 1.25.1, and Ubuntu 24.04 ships 1.24.
    # On a newer nginx you can move it to its own `http2 on;` line. nginx
    # 1.26 emits a deprecation *warning* for this form; `nginx -t` still exits
    # 0 and the installer treats it as success (verified on a real host).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nobi.example.ir;

    ssl_certificate     /etc/letsencrypt/live/nobi.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nobi.example.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    access_log /var/log/nginx/nobi.access.log nobi;
    error_log /var/log/nginx/nobi.error.log warn;

    client_max_body_size 2m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    75s;
    proxy_read_timeout    75s;

    # If you set NBX_TRUSTED_PROXIES in the app, this must match it: the app
    # only believes the header when the peer is a trusted proxy, so nginx has
    # to reach it over loopback (it does) and the app must list 127.0.0.1.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # The app also sets these for direct/non-nginx runs. Hide the upstream copy
    # so the edge `add_header ... always` below is the single authoritative value
    # (including on nginx-generated 4xx/5xx), not a duplicate header pair.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;

    location / {
        proxy_pass http://nobi_app;
        proxy_http_version 1.1;
        # Repeat the full proxy header set: this location defines its own
        # proxy_set_header, so server-level proxy_set_header is not inherited.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # Static assets are served by the app (it inlines the page on purpose),
    # but a short cache on hashed/static paths saves the loopback hop.
    location /assets/ {
        proxy_pass http://nobi_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # This location owns Cache-Control too; hide the upstream copy and the
        # security headers so the repeated add_header set below is not doubled.
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # The dashboard must not be cached: it is edited in place and a stale tab
    # is a bug report about the wrong build.
    location = / {
        proxy_pass http://nobi_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
