# /etc/nginx/sites-available/nobi
#
# Merged edge configuration for capoy.ir, based on the operator-provided live
# site file. It preserves the existing upstream, TLS paths, ACME webroot, log
# format, timeouts, and redirect behavior. The merge fixes nginx header
# inheritance and removes duplicate upstream/app security headers.
#
# Load-bearing rules:
#
# 1. Every proxied location repeats the full forwarded-header set. nginx does
#    not inherit server-level proxy_set_header directives into a location that
#    defines any proxy_set_header of its own.
#
# 2. The app also emits security headers for direct/non-nginx runs. nginx hides
#    the upstream copy and adds one authoritative edge copy with `always`.
#    Locations that add Cache-Control repeat the full security-header set,
#    because add_header inheritance is all-or-nothing per level.
#
# 3. TLS only, no plain HTTP except the ACME webroot and redirect. HSTS is added
#    only in the HTTPS server block.
#
# 4. Do not add `proxy_set_header X-API-Token "";` here. That would strip the
#    bearer token and break token auth. nginx forwards the request header by
#    default; the custom log format below does not log it. Never move the token
#    into a URL/query string.
#
# Enable (replace the existing site, do not add a second enabled copy):
#   sudo ln -sfn /etc/nginx/sites-available/nobi /etc/nginx/sites-enabled/nobi
#   sudo nginx -t && sudo systemctl reload nginx

log_format nobi '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" rt=$request_time';

upstream nobi_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name capoy.ir;

    # ACME stays on plain HTTP; everything else is pushed to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # HTTP/2 is enabled on the listen line for compatibility with nginx 1.24.
    # On newer nginx this may emit a deprecation warning; `nginx -t` still
    # succeeds. Do not change certificate paths or listener policy blindly.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name capoy.ir;

    ssl_certificate     /etc/letsencrypt/live/capoy.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capoy.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # One authoritative edge copy of each security header, including on
    # nginx-generated 4xx/5xx responses.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    access_log /var/log/nginx/nobi.access.log nobi;
    error_log  /var/log/nginx/nobi.error.log warn;

    client_max_body_size 2m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    75s;
    proxy_read_timeout    75s;

    # If NBX_TRUSTED_PROXIES is set in the app, it must include 127.0.0.1.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Hide the app copy so the edge add_header set is not duplicated.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    location / {
        proxy_pass http://nobi_app;
        proxy_http_version 1.1;

        # This location defines proxy_set_header, so repeat the full set.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # No Cache-Control hide here: API/auth responses must keep the app's
        # single private/no-store value. Security-header hide/add are inherited
        # because this location defines neither proxy_hide_header nor add_header.
    }

    # Static assets are served by the app. Use one explicit Cache-Control value.
    # Do not combine `expires 7d` with add_header Cache-Control: that can emit
    # two Cache-Control headers. These paths are not content-hashed, so if a
    # future deploy changes them in place, clients may need a hard refresh or a
    # shorter cache policy should be chosen deliberately.
    location /assets/ {
        proxy_pass http://nobi_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Defining any proxy_hide_header here stops inheritance of the server
        # hide list, so repeat the full required hide list.
        proxy_hide_header Cache-Control;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # The dashboard must not be cached: it is edited in place and a stale tab
    # is a bug report about the wrong build.
    location = / {
        proxy_pass http://nobi_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_hide_header Cache-Control;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
