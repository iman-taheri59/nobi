# Lint and type gates. There is no build here — the file exists so that
# `ruff`, `mypy` and CI read the same configuration instead of each tool
# inventing its own defaults.
#
# Measured on the parent of the commit that added this file, with exactly the
# configuration below: 277 ruff findings and 80 mypy errors in 13 files, both
# now zero. To reproduce:
#
#   git worktree add /tmp/pre 18e7a2f~1
#   cp pyproject.toml /tmp/pre/ && cd /tmp/pre && ruff check server scripts && mypy
#
# The rule set is a choice, not a completeness claim:
#
#   * E501 (line length) is not enforced. 97 lines in server/ are longer than
#     100 columns (re-count: `awk 'length>100' $(find server -name '*.py')`)
#     and shrinking them would be a whitespace-only commit that makes
#     `git blame` useless. `line-length` is still set for a future formatter.
#   * BLE001 / S110 (blind except, pass) are not enforced. The polling loops in
#     this project catch `Exception` on purpose: one bad tick must not kill the
#     socket, and `errorlog` is where the failure is recorded. Those call sites
#     carry a `# noqa` only where the reason is local.

# The target is the *floor a machine must install on*, not the oldest syntax this
# code happens to use: `numpy==2.5.4` publishes `Requires-Python >=3.12`, so a
# 3.11 interpreter cannot install `server/requirements.txt`. `check_deploy.py`
# enforces the same floor (MIN_PYTHON) and its test keeps the two in step.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["server", "scripts"]
exclude = [".venv", "node_modules", "assets"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # pycodestyle: real syntax-level problems
    "F",                # pyflakes: undefined names, unused imports
    "W",                # pycodestyle warnings: trailing whitespace, ...
    "I",                # import order — the 47-finding majority
    "B",                # bugbear: mutable defaults, loop closures
    "UP",               # pyupgrade: `datetime.timezone.utc`, quoted annotations
    "SIM", "C4",        # simplify, comprehensions
    "RUF",              # ruff's own: unused noqa, mutable class defaults
]
ignore = [
    "RUF001", "RUF002", "RUF003",   # ambiguous unicode: the comments are Persian
    "RUF012",                       # mutable class attributes, see per-file note
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into module internals on purpose and are allowed to be blunt.
"server/tests/*" = ["B011", "SIM117"]
"scripts/*" = ["E402"]             # sys.path juggling before imports

[tool.ruff.lint.isort]
known-first-party = ["main", "journal", "money", "risk_engine", "paper_trading"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["server"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Bodies of unannotated functions are checked too: in a codebase that is only
# partly annotated, this is the flag that decides whether mypy sees anything at
# all. Turning it on surfaced 90 findings: 4 in `server/main.py` (one untyped
# `rows` list made a sort and a `join` unverifiable — now annotated) and 86
# inside test doubles. Test modules opt out on their first line with
# `# mypy: check_untyped_defs = False`: a fake broker that passes `None` on
# purpose answers to pytest, not to mypy. Every server module is checked body
# and signature.
check_untyped_defs = true
exclude = ["^\\.venv", "node_modules"]

[[tool.mypy.overrides]]
# pandas / numpy stubs make `df["t"]` resolve to `Series | Any`; the backtest
# narrows by hand and is tested behaviourally.
module = ["backtest", "fa_engine", "benchmark"]
disallow_untyped_defs = false
