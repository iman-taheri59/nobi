/* ===========================================================
 * base.css — foundation: reset-ish defaults, theme, fonts, background
 * Shared by index.html (dashboard) and version-check.html
 * =========================================================== */
* {
  font-family: 'Vazirmatn', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
html[dir="ltr"] * {
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html { scroll-behavior: smooth; }
body {
  background: #09090b;
  color: #e4e4e7;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ---------- Animated radial background ---------- */
.bg-scene { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.bg-scene::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(600px 400px at 85% -5%, rgba(52, 211, 153, 0.08), transparent 60%),
    radial-gradient(700px 500px at 10% 110%, rgba(56, 189, 248, 0.06), transparent 60%),
    radial-gradient(500px 400px at 50% 50%, rgba(99, 102, 241, 0.05), transparent 60%);
}
.bg-grid {
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, black 30%, transparent 75%);
}

/* ---------- Typography helpers ---------- */
.num {
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
.kpi-num {
  font-weight: 800;
  font-size: clamp(1.05rem, 4.5vw, 1.5rem);
  line-height: 1.3;
  overflow-wrap: anywhere;
  word-break: break-word;
}
@media (max-width: 640px) {
  .kpi-num { font-size: clamp(0.98rem, 4.2vw, 1.2rem); }
}

/* ---------- Scrollbars ---------- */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
.scroll-x {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.scroll-x::-webkit-scrollbar { height: 6px; }
.scroll-x::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.12);
  border-radius: 8px;
}

/* ---------- Layout safety helpers ---------- */
.safe-bottom {
  padding-bottom: max(1rem, env(safe-area-inset-bottom));
}
html[dir="ltr"] body { text-align: left; }
.maxw-wrap,
td,
td * {
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
}

/* ---------- Dot / pulse animations shared between badges/chips ---------- */
.dot {
  width: 0.45rem;
  height: 0.45rem;
  border-radius: 9999px;
  display: inline-block;
  flex: none;
}
.pulse-dot { animation: pulse-dot 1.6s ease-in-out infinite; }
@keyframes pulse-dot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.5); }
  50% { box-shadow: 0 0 0 6px rgba(251, 191, 36, 0); }
}
.pulse-red { animation: pulse-red 1.2s ease-in-out infinite; }
@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.5); }
  50% { box-shadow: 0 0 0 7px rgba(248, 113, 113, 0); }
}

/* ===========================================================
 * components.css — glass cards, chips, tables, buttons, indicators
 * Depends on base.css for body/typography
 * =========================================================== */

/* ---------- Glass morphism card ---------- */
.glass {
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.015));
  border: 1px solid rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(14px);
  border-radius: 1.25rem;
}
@media (hover: hover) {
  .glass:hover { border-color: rgba(255, 255, 255, 0.12); }
}

/* ---------- Chips & tags ---------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.15rem 0.55rem;
  border-radius: 9999px;
  font-size: 0.68rem;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.04);
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- Chip rows (used on signals/orders headers) ---------- */
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.375rem;
  min-width: 0;
}
.chip-row > * { flex: 0 0 auto; }

/* ---------- Navigation ---------- */
.navbtn {
  transition: all 0.25s ease;
  border: 1px solid transparent;
  border-radius: 0.9rem;
}
.navbtn.active {
  background: linear-gradient(160deg, rgba(52, 211, 153, 0.16), rgba(52, 211, 153, 0.05));
  border-color: rgba(52, 211, 153, 0.3);
  color: #a7f3d0;
}
@media (hover: hover) {
  .navbtn:not(.active):hover { background: rgba(255, 255, 255, 0.05); }
}

/* ---------- Page transitions ---------- */
.tab-page {
  animation: pageIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}

/* ---------- Progress bars ---------- */
.bar-wrap {
  height: 0.5rem;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.06);
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 9999px;
  width: 0;
  transition: width 1.1s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ---------- Tables ---------- */
.table-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 0.9rem;
  border: 1px solid rgba(255, 255, 255, 0.05);
}
table { border-collapse: collapse; }
table th {
  font-size: 0.68rem;
  color: #a1a1aa;
  font-weight: 500;
  padding: 0.6rem 0.8rem;
  text-align: right;
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.02);
}
html[dir="ltr"] table th { text-align: left; }
table td {
  padding: 0.65rem 0.8rem;
  font-size: 0.78rem;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  white-space: nowrap;
}

/* ---------- Hold-to-confirm buttons (panic / manual order) ---------- */
.hold-btn {
  position: relative;
  overflow: hidden;
  user-select: none;
  touch-action: none;
}
.hold-btn .fill {
  position: absolute;
  inset: 0;
  width: 0%;
  background: linear-gradient(90deg, rgba(248, 113, 113, 0.35), rgba(248, 113, 113, 0.65));
}

/* ---------- Toast notifications ---------- */
.toast {
  animation: toastIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(10px) scale(0.97); }
  to { opacity: 1; transform: none; }
}

/* ---------- Price ticker pulse ---------- */
.ticker { animation: tickerFade 0.6s ease; }
@keyframes tickerFade {
  from { color: #34d399; }
}

/* ---------- Mark safeguards ---------- */
.langseg button.active {
  background: rgba(52, 211, 153, 0.15);
  color: #a7f3d0;
  border-color: rgba(52, 211, 153, 0.35);
}

/* ---------- Toast attention variants ---------- */
.toast.warn {
  background: rgba(251, 191, 36, 0.06);
  border-color: rgba(251, 191, 36, 0.3);
}
.toast.ok {
  background: rgba(52, 211, 153, 0.06);
  border-color: rgba(52, 211, 153, 0.3);
}
.toast.err {
  background: rgba(248, 113, 113, 0.06);
  border-color: rgba(248, 113, 113, 0.3);
}

/* ===========================================================
 * dashboard.css — sidebar, header, layout, live-status, charts
 * Specific to the trader dashboard (index.html)
 * =========================================================== */

/* ---------- Sidebar responsive rules ---------- */
@media (max-width: 1023px) {
  html[dir="rtl"] #sidebar {
    right: 0;
    left: auto;
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    transform: translateX(100%);
  }
  html[dir="ltr"] #sidebar {
    left: 0;
    right: auto;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    transform: translateX(-100%);
  }
  #sidebar.side-open { transform: translateX(0) !important; }
}
@media (min-width: 1024px) {
  #sidebar { transform: none !important; }
}

/* ---------- Mobile language switch ---------- */
#mLangFa,
#mLangEn {
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.03);
}
#mLangFa:not(.text-emerald-300):not(.active) { color: #71717a; }
#mLangEn:not(.text-emerald-300):not(.active) { color: #71717a; }

/* ---------- Live badge (bottom right/left) ---------- */
.live-badge {
  position: fixed;
  bottom: 14px;
  right: 14px;
  z-index: 80;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 12px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(9, 9, 11, 0.85);
  backdrop-filter: blur(10px);
  font-size: 11px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
}
html[dir="ltr"] .live-badge { right: auto; left: 14px; }

.live-badge .dot {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 9999px;
  display: inline-block;
}

/* ---------- Mini horizontal bar inside live rows ---------- */
.nbx-mini-hbar {
  height: 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  overflow: hidden;
}
.nbx-mini-hbar > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #34d399, #38bdf8);
}

/* ---------- Spin loader for buttons ---------- */
.animate-spin { animation: spin 1s linear infinite; }
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ---------- Timeframe chips under candle chart ---------- */
#candleChips { scrollbar-width: none; }
#candleChips::-webkit-scrollbar { display: none; }
#candleChips .tfSel { transition: all 0.2s ease; }
@media (hover: hover) {
  #candleChips .tfSel:hover { background: rgba(255, 255, 255, 0.08); }
}

/* ---------- Status popup (API health) ---------- */
#apiStatusPop { min-width: 240px; }

/* ---------- Meta rows for info cards ---------- */
.meta-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #a1a1aa;
  padding: 5px 0;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
}

/* ---------- Responsive pagination/signals ---------- */
@media (max-width: 639px) {
  .signals-row { grid-template-columns: 1fr; }
  .glass + .glass { margin-top: 0; }
}

/* ---------- Order book color coherence ---------- */
.ob-ask { background: rgba(248, 113, 113, 0.06); border-right: 2px solid rgba(248, 113, 113, 0.4); }
.ob-bid { background: rgba(52, 211, 153, 0.06); border-right: 2px solid rgba(52, 211, 153, 0.4); }

</style>

  table td { padding:.65rem .8rem; font-size:.78rem; border-top:1px solid rgba(255,255,255,.05); white-space:nowrap; }
  .hold-btn { position:relative; overflow:hidden; user-select:none; touch-action:none; }
  .hold-btn .fill { position:absolute; inset:0; width:0%; background: linear-gradient(90deg, rgba(248,113,113,.35), rgba(248,113,113,.65)); }
  .toast { animation: toastIn .35s cubic-bezier(.22,1,.36,1) both; }
  @keyframes toastIn { from{ opacity:0; transform: translateY(10px) scale(.97);} to{opacity:1; transform:none;} }
  .ticker { animation: tickerFade .6s ease; }
  @keyframes tickerFade { from{color:#34d399;} }
  #sidebar { transition: transform .3s cubic-bezier(.22,1,.36,1); }
  .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
  .langseg button.active { background: rgba(52,211,153,.15); color:#a7f3d0; border-color: rgba(52,211,153,.35); }

  /* ---------- Robust bilingual layout ---------- */
  html[dir="ltr"] body { text-align:left; }
  /* chips that may exceed width wrap gracefully */
  .chip-row{ display:flex; flex-wrap:wrap; gap:.375rem; min-width:0; }
  .chip-row > *{ flex:0 0 auto; }
  /* long textual blocks always allowed to wrap */
  td, td *, .maxw-wrap{ overflow-wrap:anywhere; word-break:break-word; min-width:0; }
  .kpi-num{ overflow-wrap:anywhere; word-break:break-word; }
  /* safe horizontal scroller for chip rows */
  .scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .scroll-x::-webkit-scrollbar{ height:6px; }
  .scroll-x::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:8px; }
  /* mobile: allow KPI grids to remain readable even with long EN text */
  @media (max-width:640px){
    .kpi-num{ font-size:clamp(.98rem, 4.2vw, 1.2rem); }
  }
  /* sidebar eigen-direction handled by JS translate class + position */
  @media (max-width:1023px){
    html[dir="rtl"] #sidebar{ right:0; left:auto; border-left:1px solid rgba(255,255,255,.1); transform:translateX(100%); }
    html[dir="ltr"] #sidebar{ left:0; right:auto; border-right:1px solid rgba(255,255,255,.1); transform:translateX(-100%); }
    #sidebar.side-open{ transform:translateX(0)!important; }
  }
  @media (min-width:1024px){
    #sidebar{ transform:none!important; }
  }
</style>

function refreshIcons(){
  if(window.lucide){ try{ lucide.createIcons(); return; }catch(e){} }
  document.querySelectorAll('i[data-lucide]').forEach(el=>{
    const name = el.getAttribute('data-lucide');
    const paths = OFFLINE_ICONS[name] || '<circle cx="12" cy="12" r="8"/>';
    const cls = el.className || 'w-4 h-4';
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('fill','none');
    svg.setAttribute('stroke','currentColor');
    svg.setAttribute('stroke-width','2');
    svg.setAttribute('stroke-linecap','round');
    svg.setAttribute('stroke-linejoin','round');
    svg.setAttribute('class', cls);
    svg.innerHTML = paths;
    el.replaceWith(svg);
  });
}
function icon(name, cls='w-4 h-4'){ return `<i data-lucide="${name}" class="${cls}"></i>`; }

function applyStaticI18n(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG==='fa' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    if(!k || (el.closest('#segPaper') && halted)) return;
    let v = t(k);
    if(k==='hdr.api') v = v.replace('{v}', fmtNum(124));
    el.textContent = v;
  });
  document.querySelectorAll('[data-pct]').forEach(el=> el.textContent = PC(+el.dataset.pct,0,false));
  document.querySelectorAll('[data-num]').forEach(el=>{
    const n=+el.dataset.num, d=+(el.dataset.dec||0);
    el.textContent = (el.dataset.pre||'') + fmtNum(n,d) + (LANG==='fa' ? (el.dataset.suf==='%'?'٪':el.dataset.suf||'') : (el.dataset.suf||''));
  });
  document.title = t('app.title');
  /* KPI numbers */
  byId('kEquity').textContent = fmtNum(1274509000);
  byId('kToday').textContent = PC(1.2,1);
  byId('kTodayV').textContent = '+ ' + fmtNum(15300000) + (LANG==='fa'?' تومان':' IRT');

  byId('rkSug').textContent = fmtNum(251300000) + (LANG==='fa'?' تومان':' IRT');

/* =========================================================
   Toast
========================================================= */
function toast(title, msg, kind='ok'){
  const map = {
    ok:  { c:'emerald', i:'badge-check' },
    warn:{ c:'amber',   i:'triangle-alert' },
    err: { c:'red',     i:'octagon-alert' },
    info:{ c:'sky',     i:'info' }
  };
  const m = map[kind]||map.info;
  const el = document.createElement('div');
  el.className = `toast glass p-3.5 border-${m.c}-400/30 text-xs`;
  el.innerHTML = `<div class="flex items-start gap-2.5">
    <span class="text-${m.c}-400 shrink-0 mt-0.5">${icon(m.i,'w-4.5 h-4.5')}</span>
    <div class="min-w-0"><div class="font-bold mb-0.5">${title}</div><div class="text-zinc-400 leading-5">${msg}</div></div></div>`;
  byId('toasts').appendChild(el);
  refreshIcons();
  setTimeout(()=>{ el.style.transition='all .4s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(()=>el.remove(),400); }, 4200);
}

if (typeof window.LightweightCharts === 'undefined') {
  window.LightweightCharts = {
    createChart(container, opts) {
      let currentData = [];
      let chartType = 'area';
      let seriesOpts = {};
      const renderSvg = () => {
        if (!container || !currentData.length) return;
        const W = Math.max(container.clientWidth || 320, 260);
        const H = Math.max(container.clientHeight || 220, 180);
        const pad = { l: 8, r: 54, t: 12, b: 20 };
        const plotW = W - pad.l - pad.r;
        const plotH = H - pad.t - pad.b;
        const slice = currentData.slice(-90);
        const n = slice.length;
        if (!n) return;
        let minV = Infinity, maxV = -Infinity;
        slice.forEach(d => {
          const lo = d.low !== undefined ? d.low : d.value;
          const hi = d.high !== undefined ? d.high : d.value;
          if (lo < minV) minV = lo;
          if (hi > maxV) maxV = hi;
        });
        const span = Math.max(maxV - minV, 1e-6);
        const xAt = i => pad.l + (i / Math.max(n - 1, 1)) * plotW;
        const yAt = v => pad.t + (1 - (v - minV) / span) * plotH;
        const gridLines = [0.2, 0.5, 0.8].map(f => {
          const y = pad.t + f * plotH;
          const val = maxV - f * span;
          return `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W - pad.r}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3 3"/>
                  <text x="${W - pad.r + 4}" y="${(y + 3).toFixed(1)}" fill="#71717a" font-size="9">${val >= 1000 ? Math.round(val).toLocaleString() : val.toFixed(2)}</text>`;
        }).join('');

        let bodySvg = '';
        if (chartType === 'area') {
          const col = seriesOpts.lineColor || '#34d399';
          const pts = slice.map((d, i) => `${xAt(i).toFixed(1)},${yAt(d.value).toFixed(1)}`).join(' ');
          const areaPts = `${xAt(0).toFixed(1)},${(pad.t + plotH).toFixed(1)} ${pts} ${xAt(n - 1).toFixed(1)},${(pad.t + plotH).toFixed(1)}`;
          bodySvg = `<polygon points="${areaPts}" fill="${col}" fill-opacity="0.16"/>
                     <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
        } else {
          const cw = Math.max(2, Math.min(8, (plotW / n) * 0.65));
          bodySvg = slice.map((d, i) => {
            const x = xAt(i);
            const up = d.close >= d.open;
            const col = up ? (seriesOpts.upColor || '#34d399') : (seriesOpts.downColor || '#f87171');
            const yH = yAt(d.high), yL = yAt(d.low);
            const yO = yAt(d.open), yC = yAt(d.close);
            const top = Math.min(yO, yC), bh = Math.max(1.5, Math.abs(yC - yO));
            return `<line x1="${x.toFixed(1)}" y1="${yH.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yL.toFixed(1)}" stroke="${col}" stroke-width="1"/>
                    <rect x="${(x - cw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${cw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}" rx="0.5"/>`;
          }).join('');
        }
        container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-full select-none">${gridLines}${bodySvg}</svg>`;
      };
      return {
        addAreaSeries(o) {
          chartType = 'area'; seriesOpts = o || {};
          return {
            setData(arr) { currentData = Array.isArray(arr) ? arr.slice() : []; renderSvg(); },
            update(pt) { if (pt) { currentData.push(pt); renderSvg(); } }
          };
        },
        addCandlestickSeries(o) {
          chartType = 'candle'; seriesOpts = o || {};
          return {
            setData(arr) { currentData = Array.isArray(arr) ? arr.slice() : []; renderSvg(); },
            update(pt) {
              if (!pt || !currentData.length) return;
              const last = currentData[currentData.length - 1];
              if (last && last.time === pt.time) currentData[currentData.length - 1] = pt;
              else currentData.push(pt);
              renderSvg();
            }
          };
        },
        applyOptions() { renderSvg(); },
        timeScale() { return { fitContent() { renderSvg(); } }; }
      };
    }
  };
}

function genWalk(n, start, drift=0.0015, vol=0.011){
  let v=start, arr=[], tms=Math.floor(Date.now()/1000)-n*86400;
  for(let i=0;i<n;i++){ v*= (1+drift+rand(-vol,vol)); arr.push({time:tms+i*86400, value:+(v).toFixed(0)}); }
  return arr;
}

/* calibration chart (score decile vs hit-rate) */
const calData = [ // [scoreMid, hitRate]
  [55,0.38],[60,0.46],[65,0.57],[70,0.64],[75,0.71],[80,0.79],[88,0.86]
];
function drawCal(){
  const el=byId('calChart'); if(!el) return;
  const W=320,H=200,pad={l:38,r:12,t:12,b:26};
  const xs = i => pad.l + i*(W-pad.l-pad.r)/(calData.length-1);
  const ys = v => H-pad.b - v*(H-pad.t-pad.b)/0.95;
  let html=`
    <line x1="${pad.l}" y1="${ys(0)}" x2="${xs(calData.length-1)}" y2="${ys(0.95)}" stroke="rgba(255,255,255,.15)" stroke-dasharray="4 4"/>
    <g fill="#71717a" font-size="9" font-family="Vazirmatn">
      ${[0,25,50,75,95].map(v=>`<text x="${pad.l-6}" y="${ys(v/100)+3}" text-anchor="end">${fmtNum(v)}${LANG==='fa'?'٪':'%'}</text>`).join('')}
      ${calData.map((p,i)=>`<text x="${xs(i)}" y="${H-8}" text-anchor="middle">${fmtNum(p[0])}</text>`).join('')}
    </g>`;
  const path = calData.map((p,i)=>`${i?'L':'M'}${xs(i)},${ys(p[1])}`).join(' ');
  html += `<path d="${path}" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  html += calData.map((p,i)=>`<circle cx="${xs(i)}" cy="${ys(p[1])}" r="4" fill="#09090b" stroke="#34d399" stroke-width="2"/>`).join('');
  el.innerHTML = html;
}

function resolveQ(id, approve){
  const q = queue.find(x=>x.id===id); if(!q) return;
  const rr = Math.abs((q.tp1-q.entry)/(q.entry-q.stop));
  if(approve && q.risk>0.75){ toast(t('dk.warn1'), t('dk.warn1')+' — '+t('dk.ok')+': '+PC(0.75,2), 'err'); return; }
  if(approve && rr<1.5){ toast(t('dk.warn3'), t('dk.warn3'), 'warn'); return; }
  q.state = approve?'approved':'rejected';
  queue = queue.filter(x=>x.id!==id);
  audit.unshift({ t:new Date().toLocaleTimeString('fa-IR'), a:'human',
    act: approve?{fa:'تأیید و ارسال',en:'Approved & sent'}:{fa:'رد سیگنال',en:'Signal rejected'},
    sym:q.sym, d:{fa:`امتیاز ${fmtNum(q.score)} · ریسک ${PC(q.risk,2)}`,en:`score ${fmtNum(q.score)} · risk ${PC(q.risk,2)}`} });
  renderQueue(); renderAudit();
  toast(approve?t('dk.tApproved'):t('dk.tRejected'), approve?t('dk.tApprovedM'):t('dk.tRejectedM'), approve?'ok':'warn');
}

  });

function updateTicket(){
  const {sym,side,price,amount,stop,tp} = manual;
  const notional = price*amount;
  const riskAmt = Math.abs(price-stop)*amount;
  const riskPct = riskAmt/EQUITY*100;
  const rr = Math.abs(tp-price)/Math.abs(price-stop);
  const exposure = notional/EQUITY*100;
  byId('pNotional').textContent = fmtNum(notional);
  byId('pRisk').textContent = fmtNum(riskAmt);
  byId('pRiskPct').textContent = PC(riskPct,2);
  byId('pRR').textContent = fmtNum(rr,2);
  const warns=[];
  if(riskPct>0.75) warns.push(['dk.warn1','red']);
  if(exposure>25) warns.push(['dk.warn2','amber']);
  if(rr<1.5) warns.push(['dk.warn3','amber']);
  const w = byId('capWarn');
  if(!price||!amount||!stop){ w.className='mt-2.5 text-[10px] leading-5 rounded-lg p-2.5 border border-white/10 bg-white/[.02] text-zinc-500'; w.textContent = t('dk.ticketNote'); }
  else if(warns.length){ w.className='mt-2.5 text-[10px] leading-5 rounded-lg p-2.5 border border-red-400/30 bg-red-400/[.07] text-red-300';
    w.innerHTML = warns.map(([k])=>`<div class="flex gap-1.5">${icon('triangle-alert','w-3.5 h-3.5 shrink-0 mt-0.5')}${t(k)}</div>`).join(''); }
  else { w.className='mt-2.5 text-[10px] leading-5 rounded-lg p-2.5 border border-emerald-400/30 bg-emerald-400/[.07] text-emerald-300';
    w.innerHTML = `<div class="flex gap-1.5">${icon('badge-check','w-3.5 h-3.5 shrink-0 mt-0.5')}${t('dk.ok')}</div>`; }
  refreshIcons();
}

/* ================= Grid Search heatmap ================= */
function renderGrid(result){
  const hm = (result && result.heatmap) || {};
  const heatEl = document.getElementById('gridHeat');
  const bestEl = document.getElementById('gridBest');
  const meta = document.getElementById('gridMeta');
  if (!heatEl || !hm.values || !hm.values.length) return;
  const xax = hm.x || [], yax = hm.y || [];
  let pfMax = 0;
  hm.values.flat().forEach(c => { pfMax = Math.max(pfMax, c.profit_factor || 0); });
  const rowsHTML = hm.values.map((row, i) => {
    const tds = row.map(c => {
      const pf = c.profit_factor || 0, tr = c.trades || 0;
      const ok = pf >= 1.3 && tr >= 8;
      const alphaVal = pfMax > 0 ? Math.min(0.95, Math.max(0.22, pf / pfMax)) : 0.25;
      const col = ok
        ? `background:rgba(52,211,153,${alphaVal});border-color:rgba(52,211,153,.35);color:#fff`
        : `background:rgba(248,113,113,${alphaVal * 0.75});border-color:rgba(248,113,113,.3);color:#fff`;
      return `<td class="p-1.5 text-center align-middle">
        <div class="rounded-lg px-1.5 py-1.5 sm:py-2 border" style="${col}" title="PF ${fmtNum(pf,2)} · ${fmtNum(tr)} trades">
          <div class="num font-bold text-[11px] sm:text-xs">${fmtNum(pf,2)}</div>
          <div class="num text-[9px] opacity-80">${fmtNum(tr)} tr</div>
        </div></td>`;
    }).join('');
    return `<tr><td class="p-1.5 text-start text-[10px] num text-zinc-500">${fmtNum(xax[i],2)}%</td>${tds}</tr>`;
  }).join('');
  heatEl.innerHTML = `
    <table class="w-full min-w-[340px]">
      <thead><tr>
        <th class="p-1.5 text-start text-[10px] text-zinc-500 num">${t('rk.rpt')} ↘ k×ATR</th>
        ${yax.map(y=>`<th class="p-1.5 text-center text-[10px] num text-zinc-500">${fmtNum(y,2)}</th>`).join('')}
      </tr></thead>
      <tbody>${rowsHTML}</tbody>
    </table>`;
  const b = result.best || {};
  if (bestEl) {
    bestEl.innerHTML = `
      <div class="rounded-lg bg-emerald-400/[.06] border border-emerald-300/25 p-3 text-xs space-y-1">
        <span class="font-extrabold text-emerald-300 text-sm">${t('bt.gridBest')}</span>
        <div class="mt-1.5 grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-[10px]">
          <div class="rounded bg-white/[.03] p-1.5"><span class="text-zinc-500">${t('rk.rpt')}:</span> <b class="num">${fmtNum(b.params?.risk_pct||0,2)}%</b></div>
          <div class="rounded bg-white/[.03] p-1.5"><span class="text-zinc-500">stop k:</span> <b class="num">${fmtNum(b.params?.atr_stop_k||0,2)}</b></div>
          <div class="rounded bg-white/[.03] p-1.5"><span class="text-zinc-500">PF:</span> <b class="text-emerald-300">${fmtNum(b.aggregate?.profit_factor||0,2)}</b></div>
        </div>
      </div>`;
  }
  if (meta) meta.textContent = `${fmtNum(result.combo_count||0)} ${LANG==='fa'?'ترکیب':'combos'} · ${fmtNum(result.elapsed_s||0,1)}s`;
}

  /* ----------------------------------------------------------
   * 5. Standalone Walk-Forward Backtest & Grid Engine (ADR-0009)
   * --------------------------------------------------------- */
  NBX.Backtest = {
    runWindow(candles, symbol, tf, cfg) {
      const initEq = +(cfg.initial_equity || cfg.equity || 50000);
      let equity = initEq;
      let cash = initEq;
      const riskPct = +(cfg.risk_pct || 0.75);
      const stopK = +(cfg.atr_stop_k || 2.0);
      const maxOpen = +(cfg.max_concurrent || 5);
      const feePct = 0.002;
      const openPos = [];
      const closed = [];
      const equityCurve = [];

      for (let i = 60; i < candles.length; i++) {
        const c = candles[i];
        const slice = candles.slice(0, i + 1);
        const sig = TA.signalScore(slice);

        for (let pIdx = openPos.length - 1; pIdx >= 0; pIdx--) {
          const tr = openPos[pIdx];
          let exitPx = null, reason = null;
          if (tr.tp1 && c.h >= tr.tp1) {
            exitPx = tr.tp1;
            reason = 'tp1';
          } else if (c.l <= tr.stop) {
            exitPx = tr.stop;
            reason = 'sl';
          }
          if (exitPx !== null) {
            const notionalIn = tr.entry * tr.qty;
            const notionalOut = exitPx * tr.qty;
            const pnl = notionalOut - notionalIn - (notionalIn + notionalOut) * feePct;
            const riskUnit = Math.abs(tr.entry - tr.stop) * tr.qty;
            tr.exit = exitPx;
            tr.exit_t = c.t;
            tr.reason = reason;
            tr.realized_pnl = pnl;
            tr.r_multiple = riskUnit > 0 ? pnl / riskUnit : 0;
            cash = Math.max(0, cash + notionalOut * (1 - feePct));
            openPos.splice(pIdx, 1);
            closed.push(tr);
          }
        }

        if (sig.direction === 'LONG' && openPos.length < maxOpen) {
          const entry = c.c;
          const atrV = sig.risk.atr || entry * 0.015;
          const stop = entry - stopK * atrV;
          const stopDist = entry - stop;
          const tp1 = entry + 1.5 * stopDist;
          const tp2 = entry + 2.5 * stopDist;
          const riskAmt = (equity * riskPct) / 100;
          const qty = stopDist > 0 ? riskAmt / stopDist : 0;
          const cost = qty * entry * (1 + feePct);
          if (qty > 0 && cost < cash) {
            cash -= cost;
            openPos.push({ side: 'buy', entry_t: c.t, entry, stop, tp1, tp2, qty });
          }
        }

        const openVal = openPos.reduce((acc, tr) => acc + c.c * tr.qty, 0);
        equity = cash + openVal;
        equityCurve.push([c.t * 1000, +equity.toFixed(2)]);
      }

      if (candles.length) {
        const lastC = candles[candles.length - 1];
        while (openPos.length) {
          const tr = openPos.pop();
          const notionalIn = tr.entry * tr.qty;
          const notionalOut = lastC.c * tr.qty;
          const pnl = notionalOut - notionalIn - (notionalIn + notionalOut) * feePct;
          const riskUnit = Math.abs(tr.entry - tr.stop) * tr.qty;
          tr.exit = lastC.c;
          tr.exit_t = lastC.t;
          tr.reason = 'eod';
          tr.realized_pnl = pnl;
          tr.r_multiple = riskUnit > 0 ? pnl / riskUnit : 0;
          closed.push(tr);
        }
      }

      const wins = closed.filter((t) => t.realized_pnl > 0);
      const losses = closed.filter((t) => t.realized_pnl <= 0);
      const total = closed.length;
      const hitRate = total ? (wins.length / total) * 100 : 0;
      const sumWin = wins.reduce((a, b) => a + b.realized_pnl, 0);
      const sumLoss = Math.abs(losses.reduce((a, b) => a + b.realized_pnl, 0));
      const pf = total && losses.length ? Math.min(99.99, sumWin / Math.max(sumLoss, 1e-9)) : wins.length ? 2.4 : 0;
      const expR = total ? closed.reduce((a, b) => a + (b.r_multiple || 0), 0) / total : 0;

      let peak = initEq, mdd = 0;
      for (const [, v] of equityCurve) {
        if (v > peak) peak = v;
        const dd = ((peak - v) / Math.max(peak, 1)) * 100;
        if (dd > mdd) mdd = dd;
      }

      const fmtIso = (ts) => new Date(ts * 1000).toISOString();
      return {
        symbol,
        tf,
        window_start: candles.length ? fmtIso(candles[0].t) : '',
        window_end: candles.length ? fmtIso(candles[candles.length - 1].t) : '',
        trades: total,
        wins: wins.length,
        losses: losses.length,
        hit_rate: +hitRate.toFixed(1),
        profit_factor: +pf.toFixed(2),
        expectancy_r: +expR.toFixed(3),
        max_drawdown: +mdd.toFixed(1),
        equity_curve: equityCurve.slice(-300),
        sample_trades: closed.slice(-8).map((t) => ({
          entry: t.entry,
          exit: t.exit,
          reason: t.reason,
          pnl: +t.realized_pnl.toFixed(2),
          r: +(t.r_multiple || 0).toFixed(2),
        })),
      };
    },

    runWalkForward(candles, symbol, tf, cfg = {}) {
      const tb = +(cfg.train_bars || 200);
      const eb = +(cfg.eval_bars || 120);
      const windows = [];
      let start = 0;
      while (start + tb + eb <= candles.length) {
        const evalSlice = candles.slice(start + tb - 60, start + tb + eb);
        const w = this.runWindow(evalSlice, symbol, tf, cfg);
        windows.push(w);
        start += eb;
      }
      if (!windows.length) {
        windows.push(this.runWindow(candles, symbol, tf, cfg));
      }
      const totalTrades = windows.reduce((a, w) => a + w.trades, 0);
      const totalWins = windows.reduce((a, w) => a + w.wins, 0);
      const denom = Math.max(1, totalTrades);
      const hitRate = windows.reduce((a, w) => a + w.hit_rate * w.trades, 0) / denom;
      const pf = windows.reduce((a, w) => a + w.profit_factor * w.trades, 0) / denom;
      const expR = windows.reduce((a, w) => a + w.expectancy_r * w.trades, 0) / denom;
      const mdd = Math.max(...windows.map((w) => w.max_drawdown), 0);
      const hash = hashSeed(JSON.stringify({ symbol, tf, cfg })).toString(16).slice(0, 8);
      return {
        config_hash: hash,
        symbol,
        tf,
        windows: windows.length,
        aggregate: {
          trades: totalTrades,
          total_wins: totalWins,
          hit_rate: +hitRate.toFixed(1),
          profit_factor: +pf.toFixed(2),
          expectancy_r: +expR.toFixed(3),
          max_drawdown: +mdd.toFixed(1),
        },
        details: windows.slice(-3),
      };
    },

    gridSearch(candles, symbol, tf, customGrid) {
      const t0 = performance.now();
      const grid = customGrid || { risk_pct: [0.5, 1.0, 1.5], atr_stop_k: [1.5, 2.0, 2.5] };
      const xax = grid.risk_pct || [0.5, 1.0, 1.5];
      const yax = grid.atr_stop_k || [1.5, 2.0, 2.5];
      const paths = [];
      let best = null;

      for (const r of xax) {
        for (const k of yax) {
          const params = { risk_pct: r, atr_stop_k: k };
          const wf = this.runWalkForward(candles, symbol, tf, params);
          const a = wf.aggregate;
          const score = a.profit_factor * 0.5 + a.expectancy_r + (a.hit_rate / 100) * 0.2 - (a.max_drawdown / 100) * 0.5;
          const item = { params, aggregate: a, _score: score };
          paths.push(item);
          if (!best || score > best._score) best = item;
        }
      }

      const values = xax.map((x) =>
        yax.map((y) => {
          const found = paths.find((p) => p.params.risk_pct === x && p.params.atr_stop_k === y);
          return Object.assign({ risk_pct: x, atr_stop_k: y }, found ? found.aggregate : {});
        })
      );

      return {
        ok: true,
        symbol,
        tf,
        combo_count: xax.length * yax.length,
        elapsed_s: +((performance.now() - t0) / 1000).toFixed(2),
        best: {
          params: best ? best.params : {},
          aggregate: best ? best.aggregate : {},
          score: best ? +best._score.toFixed(3) : 0,
        },
        heatmap: { x: xax, y: yax, values },
      };
    },
  };

  /* ----------------------------------------------------------
   * 6. API client (browser-safe, with full mobile fallback)

  class NobitexApi {
    constructor(options) {
      this.opts = Object.assign({}, cfg, options || {});
      this.bucket = new NBX.TokenBucket(this.opts.ratePerMinute);
      this.connected = false;
      this.standaloneMobile = isFileOrMobileLocal;
      this.circuitOpenUntil = 0;
      this.stats = { total: 0, ok: 0, fail: 0, lastLatencyMs: 18 };
      this._healthListeners = [];
    }

    _url(path) {
      if (/^https?:\/\//i.test(path) || path.startsWith('/api/') || path === '/api') {
        return path;
      }
      return this.opts.baseUrl + path;
    }

    onHealth(fn) {
      this._healthListeners.push(fn);
      return () => (this._healthListeners = this._healthListeners.filter((x) => x !== fn));
    }
    _emitHealth(h) {
      this.connected = h.ok;
      this._healthListeners.forEach((fn) => {
        try { fn(h); } catch (e) {}
      });
    }

    async _fetch(path) {
      const url = this._url(path);
      const isBackendUrl = url.startsWith('/api/') || url === '/api' || (cfg.pythonApi && url.startsWith(cfg.pythonApi));
      if (!isBackendUrl && Date.now() < this.circuitOpenUntil) {
        throw new NBXError('NETWORK', 'circuit-open');
      }
      const proxy = !isBackendUrl && this.opts.apiProxy ? this.opts.apiProxy : '';
      const finalUrl = proxy ? proxy + encodeURIComponent(url) : url;
      const t0 = performance.now();
      const controller = new AbortController();
      const to = setTimeout(() => controller.abort(), this.opts.timeoutMs);
      try {
        const res = await fetch(finalUrl, { signal: controller.signal, mode: 'cors' });
        clearTimeout(to);
        const latency = performance.now() - t0;
        this.stats.total++;
        this.stats.lastLatencyMs = latency;
        if (!res.ok) {
          this.stats.fail++;
          if (res.status === 429) throw new NBXError('RATE', 'rate limited', { status: res.status });
          throw new NBXError('HTTP', 'bad status ' + res.status, { status: res.status });
        }
        const data = await res.json();
        this.stats.ok++;
        this._emitHealth({ ok: true, latency });
        return data;
      } catch (e) {
        clearTimeout(to);
        this.stats.fail++;
        if (!isBackendUrl) {
          this.circuitOpenUntil = Date.now() + 120000;
        }
        this._emitHealth({ ok: false, error: e });
        if (e instanceof NBXError) throw e;
        throw new NBXError('NETWORK', e.message || 'fetch failed', { error: e });
      }
    }

    async get(path, attempts) {
      const tries = attempts !== undefined ? attempts : this.opts.maxRetries;
      let lastErr;
      for (let i = 0; i < tries; i++) {
        try {
          if (!this.bucket.allow()) await sleep(80);
          return await this._fetch(path);
        } catch (e) {
          lastErr = e;
          if (e.code === 'RATE') await sleep(800 * (i + 1));
          else break;
        }
      }
      throw lastErr;
    }

      if (this.standaloneMobile) {

        books: {
          BTCIRT: { best_bid: 4984000000, best_ask: 4986000000, mid: 4985000000, fresh: true, latency: 14 },
          ETHUSDT: { best_bid: 3361, best_ask: 3363, mid: 3362, fresh: true, latency: 15 },
          SOLUSDT: { best_bid: 173.4, best_ask: 173.8, mid: 173.6, fresh: true, latency: 14 },
        },
      };
    }

    _getCandlesForBacktest(symbol, tf) {
      const sym = normSymbol(symbol);
      const engine = NBX.core && NBX.core.engine;
      const existing = engine && (engine.candles[sym + ':' + tf] || engine.candles[sym]);
      if (existing && existing.length >= 200) return existing;
      return synthCandlesFor(sym, tf || '1h', 380);
    }

    async runBacktest(symbol, tf, btCfg) {
      if (!this.standaloneMobile) {
        try {
          const res = await fetch(cfg.pythonApi + '/backtest/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ symbol, tf, ...btCfg }),
          });
          const r = await res.json();
          if (res.ok && r && (r.ok || r.error)) return r;
        } catch (e) {}
      }
      await sleep(60);
      const sym = normSymbol(symbol || 'BTCIRT');
      const rows = this._getCandlesForBacktest(sym, tf || '1h');
      const report = NBX.Backtest.runWalkForward(rows, sym, tf || '1h', btCfg || {});
      return { ok: true, report, standalone: true };
    }

    async runGridSearch(symbol, tf, grid) {
      if (!this.standaloneMobile) {
        try {
          const res = await fetch(cfg.pythonApi + '/backtest/grid', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ symbol, tf, grid: grid || undefined }),
          });
          const r = await res.json();
          if (res.ok && r && (r.ok || r.error)) return r;
        } catch (e) {}
      }
      await sleep(80);
      const sym = normSymbol(symbol || 'BTCIRT');
      const rows = this._getCandlesForBacktest(sym, tf || '1h');
      return NBX.Backtest.gridSearch(rows, sym, tf || '1h', grid);
    }

    async runGridMulti(symbols, tf, grid) {
      if (!this.standaloneMobile) {
        try {
          const res = await fetch(cfg.pythonApi + '/grid-multi', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ symbols, tf, grid: grid || undefined }),
          });
          const r = await res.json();
          if (res.ok && r && (r.ok || r.error)) return r;
        } catch (e) {}
      }
      await sleep(100);
      const syms = (symbols || ['BTCIRT', 'ETHIRT', 'TONIRT', 'SOLIRT', 'BTCUSDT', 'ETHUSDT']).slice(0, 8);
      const results = syms.map((s) => {
        const sym = normSymbol(s);
        const rows = this._getCandlesForBacktest(sym, tf || '1h');
        const g = NBX.Backtest.gridSearch(rows, sym, tf || '1h', grid);
        return { symbol: sym, best: g.best, elapsed_s: g.elapsed_s, combo_count: g.combo_count };
      });
      return { ok: true, tf: tf || '1h', results };
    }

    async getBacktestQuick(symbol, tf) {
      return this.runBacktest(symbol || 'BTCIRT', tf || '1h', {});
    }

    async getStats() {
      return this.get('/market/stats');
    }

    async getOrderbook(symbol) {
      return this.get('/v3/orderbook/' + normSymbol(symbol));
    }

    async getOrderbookAll() {
      return this.get('/v3/orderbook/all');
    }

    async getCandles(symbol, timeframe, count) {
      if (this.standaloneMobile || Date.now() < this.circuitOpenUntil) {
        return synthCandlesFor(symbol, timeframe || '15m', count || cfg.maxCandles);
      }
      const tfs = { '1m': 60, '5m': 300, '15m': 900, '30m': 1800, '1h': 3600, '4h': 14400, D: 86400 };
      const tfSec = tfs[timeframe] || 900;
      const to = Math.floor(Date.now() / 1000);
      const from = to - Math.min(count || 260, 300) * tfSec;
      const res = timeframe === 'D' ? 'D' : tfSec === 3600 ? '60' : tfSec === 240 * 60 ? '240' : String(tfSec / 60);
      const q = new URLSearchParams({
        symbol: normSymbol(symbol),
        resolution: String(res),
        from: String(from),
        to: String(to),
      });
      const raw = await this.get('/market/udf/history?' + q.toString(), 1);
      if (!raw || raw.s !== 'ok' || !Array.isArray(raw.c) || raw.c.length === 0) {
        throw new NBXError('DATA', 'bad candles payload for ' + symbol, { raw });
      }
      const rows = raw.t.map((t, i) => ({
        t,
        o: +raw.o[i],
        h: +raw.h[i],
        l: +raw.l[i],
        c: +raw.c[i],
        v: +raw.v[i],
      }));
      rows.sort((a, b) => a.t - b.t);
      return rows;
    }
  }
  NBX.NobitexApi = NobitexApi;

  /* ----------------------------------------------------------
   * 7. Market store + scanner (ADR-0004/0007)
   * --------------------------------------------------------- */
  class MarketEngine {
    constructor(api) {
      this.api = api;
      this.universe = [];
      this.books = {};
      this.candles = {};
      this.signals = {};
      this.premium = 68250;
      this.onUpdate = [];
      this.scanning = false;
    }
    subscribe(fn) {
      this.onUpdate.push(fn);
      return () => (this.onUpdate = this.onUpdate.filter((x) => x !== fn));
    }
    emit(type, payload) {
      this.onUpdate.forEach((f) => {
        try { f(type, payload); } catch (e) {}
      });
    }

    _seedUniverse() {
      return Object.entries(SEED_MARKETS).map(([symbol, m]) => ({
        symbol,
        last: m.last,
        vol24: m.vol24,
        change24: m.change24,
      }));
    }

    async loadUniverse() {
      if (this.api.standaloneMobile) {
        this.universe = this._seedUniverse();
        this.premium = SEED_MARKETS.USDTIRT.last;
        this.emit('universe', this.universe);
        return;
      }
      try {
        const stats = await this.api.getStats();
        if (stats && stats.stats) {
          const rows = Object.entries(stats.stats).map(([sym, d]) => ({
            symbol: normSymbol(sym),
            last: +d.latest || +d.last || 0,
            vol24: +d.valueDst || +d.volumeDst || +d['24h_volume'] || 0,
            change24: +d.dayChange || 0,
          }));
          this.universe = rows.filter((r) => r.symbol && r.last > 0);
          this.premium = (rows.find((x) => x.symbol === 'USDTIRT') || {}).last || 68250;
        }
      } catch (e) {
        this.universe = this._seedUniverse();
        this.premium = SEED_MARKETS.USDTIRT.last;
      }
      if (!this.universe.length) {
        this.universe = this._seedUniverse();
      }
      this.universe = this.universe.sort((a, b) => b.vol24 - a.vol24).slice(0, cfg.universeTopN);
      this.emit('universe', this.universe);
    }

    async scan(timeframe) {
      if (this.scanning) return;
      this.scanning = true;
      const tf = timeframe || cfg.timeframes[0];
      if (!this.universe.length) {
        this.universe = this._seedUniverse();
      }
      for (const u of this.universe) {
        const sym = u.symbol;
        try {
          const rows = await this.api.getCandles(sym, tf, cfg.maxCandles);
          this.candles[sym] = rows;
          this.candles[sym + ':' + tf] = rows;
          this.signals[sym] = NBX.TA.signalScore(rows);
        } catch (e) {
          const rows = synthCandlesFor(sym, tf, cfg.maxCandles);
          this.candles[sym] = rows;
          this.candles[sym + ':' + tf] = rows;
          this.signals[sym] = NBX.TA.signalScore(rows);
        }
      }
      this.scanning = false;
      this.emit('signals', this.rankSignals());
    }

    _synthCandles(base, sym, tf) {
      return synthCandlesFor(sym || 'BTCIRT', tf || '15m', cfg.maxCandles);
    }

    rankSignals() {
      return this.universe
        .map((u) => {
          const s = this.signals[u.symbol] || { score: 0, direction: 'NEUTRAL' };
          const liq = Math.round(clamp(50 + Math.log10((u.vol24 || 1) + 1) * 4, 0, 100));
          const faObj = NBX.FA.scoreSymbol(u.symbol, liq);
          const fa = faObj.score;
          const composite = clamp(0.55 * s.score + 0.25 * fa + 0.2 * liq, 0, 100);
          return {
            ...u,
            ...s,
            liquidity_score: liq,
            fa_score: fa,
            fa: { score: fa, vetoes: faObj.vetoes, evidence: faObj.evidence },
            composite: +composite.toFixed(1),
          };
        })
        .sort((a, b) => b.composite - a.composite);
    }
  }
  NBX.MarketEngine = MarketEngine;

  /* ----------------------------------------------------------
   * 8. Facade helpers
   * --------------------------------------------------------- */
  NBX.createCore = function (overrides) {
    const api = new NobitexApi(overrides);
    const engine = new MarketEngine(api);
    return { api, engine };
  };

  NBX.state = { ready: false };
  NBX.boot = async function () {
    if (NBX.state.ready) return NBX.core;
    const core = NBX.createCore();
    NBX.core = core;
    const backend = await core.api.checkBackend();
    if (!backend || !backend.ok) {
      await core.engine.loadUniverse();
      await core.engine.scan(cfg.timeframes[0]);
    }
    NBX.state.ready = true;
    return core;
  };
})();

</script>

      const saveFn = (e) => {
        e.preventDefault();
        m.classList.add('hidden');
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'nobitex-mobile.html';
        a.click();
      };
      if ($('dlSingleHtmlBtn')) $('dlSingleHtmlBtn').onclick = saveFn;
      if ($('dlLocalBlobBtn')) $('dlLocalBlobBtn').onclick = saveFn;
    }
  }

  /* ---------- index.html i18n augmentation ---------- */
  const extraI18n = {
    fa: {
      'app.title': 'اتاق فرمان نوبیتکس (نسخه کامل موبایل و وب)',
      'page.overview.desc': 'وضعیت سرمایه، پوزیشن‌ها و بازار — آماده اجرا روی موبایل و دسکتاپ',
      'page.signals.desc': 'رتبه‌بندی زنده دنیای نوبیتکس با موتور TA و FA',
      'sg.hdr': 'اسکنر زنده نوبیتکس',
      'sg.scanned': '{ranked} نماد اسکن شد',
      'sg.cycle': 'چرخه: {tf} — auto {m}m',
      'sg.last': 'آخرین چرخه: {s} ثانیه پیش',
      'ov.kpi1sub': '+۸٫۲٪ (عملکرد کل سبد)',
      't.connected': 'موتور تحلیلی آماده است',
      't.connectedM': 'دنیای نمادها بارگذاری و با موتور تکنیکال و فاندامنتال امتیازدهی شد.',
      't.degraded': 'حالت پیش‌نمایش مستقل موبایل',
      't.degradedM': 'موتور تحلیل تکنیکال، فاندامنتال، ریسک و بک‌تست به‌صورت مستقیم روی مرورگر گوشی فعال است.',
    },
    en: {
      'app.title': 'Nobitex Command Center (Mobile & Web)',
      'page.overview.desc': 'Equity, positions and market state — mobile & desktop ready',
      'page.signals.desc': 'Nobitex universe ranking with TA & FA engines',
      'sg.hdr': 'Live Nobitex Scanner',
      'sg.scanned': '{ranked} symbols scanned',
      'sg.cycle': 'Cycle: {tf} — auto {m}m',
      'sg.last': 'Last cycle: {s}s ago',
      't.connected': 'Analytics engine ready',
      't.connectedM': 'Universe loaded and scored by the TA & FA engines.',
      't.degraded': 'Standalone Mobile Preview Active',
      't.degradedM': 'TA, FA, Risk, Paper Trading & Backtest engines are running locally in your browser.',
    },
  };
  Object.keys(extraI18n).forEach((l) => Object.assign(T[l] || {}, extraI18n[l]));

  function setLiveMode(m, latency) {
    live.mode = m;
    live.latency = latency || live.latency;
    renderLiveBadge();
  }

  /* ---------- Overview updates: chart + positions ---------- */
  injectCandleSelector();

  function injectCandleSelector() {
    if ($('candleChips')) return;
    const anchor = $('candleChart')?.previousElementSibling;
    if (!anchor) return;
    const div = document.createElement('div');
    div.id = 'candleChips';
    div.className = 'flex gap-1.5 overflow-x-auto pb-1';
    div.innerHTML = ['15m', '1h', '4h', 'D']
      .map(
        (tf) => `
      <button data-tf="${tf}" class="tfSel px-2.5 py-1 rounded-lg text-[10px] font-bold border transition ${
          tf === '15m' ? 'bg-emerald-400/15 text-emerald-300 border-emerald-300/30' : 'bg-white/5 text-zinc-400 border-white/10'
        }">${tf}</button>
    `
      )
      .join('');
    anchor.appendChild(div);
    document.querySelectorAll('.tfSel').forEach(
      (b) =>
        (b.onclick = () => {
          document.querySelectorAll('.tfSel').forEach((x) => (x.className = 'tfSel px-2.5 py-1 rounded-lg text-[10px] font-bold border transition bg-white/5 text-zinc-400 border-white/10'));
          b.className = 'tfSel px-2.5 py-1 rounded-lg text-[10px] font-bold border transition bg-emerald-400/15 text-emerald-300 border-emerald-300/30';
          live.timeframe = b.dataset.tf;
          scanNow(true);
        })
    );
  }

  async function updateOverviewFromLive() {
    const engine = NBX.core.engine;
    const ranked = engine.rankSignals();
    live.ranked = ranked;
    const top = ranked.find((x) => x.symbol === live.activeSymbol) || ranked.find((x) => x.composite >= 60) || ranked[0];
    if (top) live.activeSymbol = top.symbol;

    try {
      let rows = engine.candles[live.activeSymbol + ':' + live.timeframe] || engine.candles[live.activeSymbol];
      if ((!rows || !rows.length) && NBX.core.api && typeof NBX.core.api.getBackendCandles === 'function') {
        const cRes = await NBX.core.api.getBackendCandles(live.activeSymbol, live.timeframe);
        if (cRes && Array.isArray(cRes.rows)) {
          rows = cRes.rows;
          engine.candles[live.activeSymbol] = rows;
          engine.candles[live.activeSymbol + ':' + live.timeframe] = rows;
        }
      }
      if (rows && rows.length && typeof candleSeries !== 'undefined' && candleSeries) {
        candleSeries.setData(rows.map((r) => ({ time: r.t, open: r.o, high: r.h, low: r.l, close: r.c })));
        lastCandle = { time: rows[rows.length - 1].t, open: rows[rows.length - 1].o, high: rows[rows.length - 1].h, low: rows[rows.length - 1].l, close: rows[rows.length - 1].c };
        if ($('lastPrice')) $('lastPrice').textContent = fmtPrice(lastCandle.close, live.activeSymbol);
        if (typeof renderOB === 'function') renderOB(lastCandle.close);
      }
    } catch (e) {}

    const unit = engine.universe.find((x) => x.symbol === live.activeSymbol);
    if (unit && unit.change24 !== undefined) {
      const ce = $('lastChg');
      if (ce) {
        ce.textContent = goodPct(unit.change24, 1);
        ce.className = 'chip num ' + (unit.change24 >= 0 ? 'text-emerald-300' : 'text-red-300');
      }
    }

    const pos = ranked.slice(0, 3).map((r) => {
      const rows = engine.candles[r.symbol + ':' + live.timeframe] || engine.candles[r.symbol];
      const close = rows && rows.length ? rows[rows.length - 1].c : r.last;
      const open = rows && rows.length > 30 ? rows[rows.length - 31].c : close * 0.98;
      return {
        sym: r.symbol,
        label: { fa: r.symbol.replace('IRT', '/تومان'), en: r.symbol },
        entry: open,
        price: close,
        size: '0.085',
        sl: '−3.8%',
        tp1: '+5.6%',
        state: { fa: 'تریل فعال', en: 'Trailing on' },
        hot: r.composite >= 65,
      };
    });
    if (typeof positions !== 'undefined' && Array.isArray(positions)) {
      positions.length = 0;
      positions.push(...pos);
      if (typeof renderPositions === 'function') renderPositions();
    }
  }

  /* ---------- Signals page from ranking ---------- */
  function renderSignalsLive() {
    const list = $('sigList');
    if (!list) return;
    const ranked = live.ranked;
    if (!ranked.length) return;
    const shdr = $('page-signals');
    if (shdr) {
      const scannedEl = shdr.querySelector('[data-i18n="sg.scanned"]');
      if (scannedEl) scannedEl.textContent = inFa('sg.scanned').replace('{ranked}', faNum(ranked.length));
      const cycleEl = shdr.querySelector('[data-i18n="sg.cycle"]');
      if (cycleEl) cycleEl.textContent = inFa('sg.cycle').replace('{tf}', live.timeframe).replace('{m}', '2');
      const lastEl = shdr.querySelector('[data-i18n="sg.last"]');
      if (lastEl) lastEl.textContent = inFa('sg.last').replace('{s}', live.lastScanAt ? faNum(Math.round((Date.now() - live.lastScanAt) / 1000)) : '—');
    }

    list.innerHTML = ranked
      .slice(0, 12)
      .map((s, i) => {
        const col = s.composite >= 60 ? 'emerald' : s.composite >= 45 ? 'amber' : 'red';
        const comp = s.components || {};
        const dir = s.direction === 'LONG' ? 'text-emerald-300' : s.direction === 'EXIT' ? 'text-red-300' : 'text-zinc-300';
        const sparkU = s.composite >= 50;
        const symLabel = LANG === 'fa' ? s.symbol.replace('IRT', '/تومان') : s.symbol;
        return `
      <div class="glass p-3.5 sm:p-4 flex flex-col md:flex-row md:items-center gap-3 sm:gap-4">
        <div class="flex items-center gap-3 md:w-44 shrink-0">
          <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center font-extrabold text-sm num ${
            i < 3 ? 'text-emerald-300' : 'text-zinc-500'
          }">${faNum(i + 1)}</div>
          <div class="min-w-0"><div class="font-bold text-[13px] sm:text-sm">${symLabel}</div>
            <span class="chip ${dir}"><span class="dot ${
          s.direction === 'LONG' ? 'bg-emerald-400' : s.direction === 'EXIT' ? 'bg-red-400' : 'bg-zinc-400'
        }"></span> ${s.direction}</span>
          </div>
          <span class="text-[10px] text-zinc-500 ms-auto md:hidden">${s.regime || ''}</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 sm:gap-3 mb-1.5">
            <span class="text-[10px] text-zinc-500 hidden sm:block w-24">${inFa('sg.score')}</span>
            <div class="nbx-mini-hbar flex-1"><i style="width:${clamp(s.composite, 0, 100)}%"></i></div>
            <span class="num font-extrabold text-${col}-300 w-8 text-start">${faNum(+s.composite.toFixed(0))}</span>
          </div>
          <div class="flex flex-wrap items-center gap-1.5 text-[10px]">
            <span class="chip">TA <b class="num">${faNum(+(s.score || 0).toFixed(0))}</b></span>
            <span class="chip">${inFa('sg.faN')} <b class="num">${faNum(Math.round(s.fa_score || 50))}</b></span>
            <span class="chip">${inFa('sg.liq')} <b class="num">${faNum(s.liquidity_score)}</b></span>
            <span class="chip">ترند <b class="num">${faNum(+(comp.trend || 0))}</b></span>
            <span class="chip">مومنتوم <b class="num">${faNum(+(comp.momentum || 0))}</b></span>
            <span class="chip ${s.regime === 'TREND' ? 'text-emerald-300' : 'text-zinc-500'}">${s.regime || ''}</span>
            ${s.risk && s.risk.stopPct ? `<span class="chip">Stop <b class="num">${faNum(+s.risk.stopPct.toFixed(2), 2)}%</b></span>` : ''}
          </div>
        </div>
        <div class="w-full md:w-36 shrink-0">${typeof spark === 'function' ? spark(sparkU) : ''}</div>
      </div>`;
      })
      .join('');
    if (typeof refreshIcons === 'function') refreshIcons();
  }

  /* ---------- FA page data-driven products ---------- */
  async function fetchBackendFA(symbols) {
    const api = NBX.core.api;
    const results = [];
    for (const sym of symbols.slice(0, 6)) {
      try {
        const r = await api.getBackendFA(sym);
        if (r) results.push(r);
      } catch (e) {}
    }
    return results;
  }

  async function updateFaPreview() {
    if (!live.ranked.length) return;
    const fa = await fetchBackendFA(live.ranked.map((x) => x.symbol));
    const avgFA = fa.length ? fa.reduce((a, x) => a + x.score, 0) / fa.length : 64;
    if ($('faAvg')) $('faAvg').textContent = faNum(Math.round(avgFA));
    const vetoCt = fa.filter((x) => x.vetoes && x.vetoes.length).length;
    if ($('faVetoes')) $('faVetoes').textContent = faNum(vetoCt);
    if ($('faPrem') && NBX.core.engine.premium) {
      const pm = NBX.core.engine.premium;
      const pct = clamp(((pm - pm * 0.995) / (pm * 0.995)) * 100, -5, 5);
      $('faPrem').textContent = '+' + faNum(Math.abs(pct) < 0.01 ? 1.8 : +pct.toFixed(1), 1) + '%';
    }
    if ($('faList')) {
      const faScoreBySym = {};
      fa.forEach((x) => (faScoreBySym[x.symbol] = x));
      $('faList').innerHTML = live.ranked
        .slice(0, 6)
        .map((x) => {
          const f = faScoreBySym[x.symbol] || NBX.FA.scoreSymbol(x.symbol);
          const sc = f ? f.score : 58;
          const extra =
            f && f.evidence && f.evidence.tvl
              ? 'TVL ' + (f.evidence.tvl / 1e9).toFixed(1) + 'B'
              : x.direction + ' · ADX ' + faNum(+((x.diagnostics?.adx || 24).toFixed(0)));
          return `
        <div class="flex items-center gap-2.5 sm:gap-3">
          <span class="w-10 sm:w-14 font-bold text-[13px] sm:text-sm shrink-0">${x.symbol.replace(/IRT|USDT/g, '')}</span>
          <div class="nbx-mini-hbar flex-1"><i style="width:${clamp(sc, 0, 100)}%"></i></div>
          <span class="num font-bold text-[13px] sm:text-sm ${sc >= 60 ? 'text-sky-300' : sc >= 45 ? 'text-amber-300' : 'text-red-300'}">${faNum(
            +sc.toFixed(0)
          )}</span>
          <span class="text-[10px] text-zinc-500 w-32 lg:w-48 hidden md:block truncate">${extra}</span>
        </div>`;
        })
        .join('');
    }

    try {
      const rs = await NBX.core.api.getBackendRiskState();
      window.__NBX_RISK_STATE = rs;
    } catch (e) {}
  }

  /* ---------- Scan scheduler (Backend first → Mobile Standalone Engine) ---------- */
  async function scanNow(force) {
    try {
      const api = NBX.core.api;
      const backend = await api.checkBackend();
      if (backend && backend.ok) {
        setLiveMode('ONLINE', backend.stats?.last_latency_ms || 18);
        const uni = await api.getBackendUniverse();
        NBX.core.engine.universe = uni.symbols;
        NBX.core.engine.premium = uni.premium_usdtirt;
        const sig = await api.getBackendSignals(live.timeframe);
        const bySym = {};
        sig.scored.forEach((s) => {
          bySym[s.symbol] = s;
        });
        NBX.core.engine.signals = bySym;
        NBX.core.engine.rankSignals = function () {
          return sig.scored;
        };
        live.lastScanAt = Date.now();
        await updateOverviewFromLive();
        renderSignalsLive();
        await updateFaPreview();
        if (force && typeof toast === 'function') {
          toast(inFa('t.connected'), inFa('t.connectedM') + ' (FastAPI)', 'ok');
        }
        return;
      }

      /* Mobile / Standalone local engine */
      setLiveMode('MOBILE', 12);
      await NBX.core.engine.loadUniverse();
      await NBX.core.engine.scan(live.timeframe);
      live.lastScanAt = Date.now();
      await updateOverviewFromLive();
      renderSignalsLive();
      await updateFaPreview();
      if (force && typeof toast === 'function') {
        toast(inFa('t.degraded'), inFa('t.degradedM'), 'info');
      }
    } catch (e) {
      setLiveMode('MOBILE', 14);
      renderLiveBadge();
    }
  }

  function schedule() {
    if (live.interval) clearInterval(live.interval);
    live.interval = setInterval(() => scanNow(false), 2 * 60 * 1000);
    const wsPoll = async () => {
      if (!NBX.core || !NBX.core.api || typeof NBX.core.api.getWsStatus !== 'function') return;
      try {
        const st = await NBX.core.api.getWsStatus();
        if (st && st.enabled) {
          live.wsMid = st.books;
        }
      } catch (e) {}
    };
    setInterval(wsPoll, 4 * 1000);
    wsPoll();
  }

  function bindApiHealth() {
    const api = NBX.core.api;
    api.onHealth(({ ok, latency }) => {
      const el = document.querySelector('[data-i18n="hdr.api"]');
      if (el) el.textContent = 'API: ' + (ok ? Math.round(latency) + 'ms' : 'local');
    });
  }

  async function start() {
    addLiveStylesOnce();
    injectMobileNavAndDownload();
    try {
      await NBX.boot();
      bindApiHealth();
      await scanNow(true);
      schedule();
    } catch (e) {
      setLiveMode('MOBILE', 14);
      renderLiveBadge();
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
