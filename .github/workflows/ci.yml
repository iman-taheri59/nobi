# The gates this project asserts in its README, run on every push.
#
# Four jobs, because they fail for different reasons and a red X should say
# which one:
#
#   python  types, behaviour and dependency advisories
#   js      the browser bundle — eslint, parity, escaping, generated artifact
#   ui      the page itself — every panel must be able to explain itself
#   windows the same python gate on the other documented platform (Laragon,
#           docs/run-windows.md). Advisory: a failure is reported but does not
#           block the Linux gates, because continue-on-error is set below.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"      # the pins need 3.12 (numpy 2.5 Requires-Python); 3.12 is the CI floor
          cache: pip
      - run: pip install -r server/requirements-dev.txt
      # No config path arguments: pyproject.toml decides what is selected.
      - name: ruff
        run: ruff check server scripts
      - name: mypy
        run: mypy
      - name: dependency advisories
        run: pip-audit -r server/requirements.txt --progress-spinner off
      - name: pytest
        run: python -m pytest -q server/tests

  # The suite passed every Linux gate for months while one module called
  # `os.geteuid()` at import time and aborted collection on Windows — the machine
  # `docs/run-windows.md` documents and the dashboard's own test card runs on.
  # Advisory on purpose: a Windows-only runner failure must not hide a green
  # Linux result, but it is still visible as its own check.
  windows:
    name: windows (advisory)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r server/requirements-dev.txt
      - name: ruff
        run: ruff check server scripts
      - name: mypy
        run: mypy
      - name: pytest
        shell: bash
        # Advisory means "reported but not blocking", not "unreported": the
        # runner log is not always retrievable, so a Windows-only failure used
        # to be a red X with no test name. Every FAILED line is emitted as a
        # check annotation too, and those the API does return with the run.
        # GitHub runs `bash -eo pipefail`, so a failing pytest would abort this
        # script before the annotations were emitted. Record the status, publish
        # the names, then fail with pytest's own code.
        run: |
          status=0
          python -m pytest -q server/tests --tb=no -rf 2>&1 | tee pytest-windows.log || status=$?
          grep -E '^(FAILED|ERROR) ' pytest-windows.log | sed 's/^/::error::/' || true
          exit "$status"

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # jsdom 30 pulls undici 8, which needs zlib.createZstdDecompress.
      # That only exists on Node >= 22.22.2; 24 is the supported LTS.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --no-fund
      - name: npm advisories
        run: npm audit --audit-level=high
      - run: pip install -r server/requirements.txt
      - name: eslint (bundles and scripts)
        run: npm run lint
      - name: eslint (index.html inline block)
        run: npm run lint:dashboard
      - name: broker parity — python vs javascript
        run: node scripts/js_broker_test.js
      - name: price ticks and decimal rounding — Python / JavaScript
        run: node scripts/test_tick_parity.js
      - name: intrabar exit rule — one candle, both engines
        run: node scripts/js_engine_parity.js
      - name: financial display and localization (offline jsdom)
        run: npm run test:display
      - name: adaptive-thresholds card (offline jsdom, stubbed api)
        run: npm run test:adaptive-card
      - name: coin icons and signal rendering
        run: npm run test:icons
      - name: DOM escaping and retry binding
        run: npm run test:escaping
      - name: signal detail expand and collapse
        run: npm run test:signal-detail
      - name: approval queue updates and rejection reasons
        run: npm run test:queue
      - name: lockfile tarballs match their versions
        run: npm run test:lock
      - name: Reviewed-page regression tests
        run: npm run test:review-phase1
      - name: Paper provenance and Signal Intelligence offline regressions
        run: npm run test:review-phase2
      - name: Retained orders and manual ticket offline regressions
        run: npm run test:review-phase3
      - name: Approval draft lifetime and candle-scoped decisions offline regressions
        run: npm run test:review-phase4
      - name: Risk plan and halt outcome offline regressions
        run: npm run test:review-phase5
      - name: Fundamentals coverage and snapshot provenance offline regressions
        run: npm run test:review-phase6
      - name: Backtest Lab reviewed-page regressions
        run: npm run test:review-phase7
      - name: Signals Explorer provenance regressions
        run: npm run test:review-phase8
      - name: Performance Report read-only regressions
        run: npm run test:review-phase9
      - name: Error Log storage and scoped UI regressions
        run: npm run test:review-phase10
      - name: Signal Intelligence filtered evidence regression
        run: npm run test:review-phase11
      - name: Overview market state and allocation regression
        run: npm run test:review-phase12
      - name: Risk audit page and scope regression
        run: npm run test:review-phase13
      # The same invariants against the real page scripts evaluated in JSDOM —
      # the extracted-copy test above cannot catch a page that stopped calling
      # the function it claims to call.
      - name: Risk audit real-page integration (jsdom)
        run: npm run test:review-phase13-integration
      - name: preflight parity — 28 cases × 10 gates
        run: python3 scripts/check_preflight_parity.py
      - name: generated mobile file is current
        run: |
          npm run css
          python3 scripts/build_standalone.py
          git diff --exit-code -- nobitex-mobile.html

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r server/requirements-dev.txt
      - run: npm ci --no-fund   # jsdom, for the smoke test
      - run: python -m playwright install --with-deps chromium
      - name: authenticated mobile header layout regression
        run: python scripts/mobile_header_test.py
      - name: connection details do not cover navigation
        run: python scripts/live_status_layout_test.py
      # The sandbox has no reachable exchange, so the panels are exercised
      # against the contract-shaped fixture — the same two-script setup the
      # README documents. A panel that cannot explain itself still fails.
      # Output is redirected: background processes that keep the step's stdout
      # pipe open make the runner wait until they exit.
      - name: fixture exchange + dashboard
        env:
          NBX_AUTH_DB: /tmp/ci-auth.db
        run: |
          nohup python3 scripts/mock_upstream.py --port 8010 > /tmp/ci-upstream.log 2>&1 &
          echo $! > /tmp/ci-upstream.pid
          nohup python3 scripts/run_with_mock_exchange.py --port 8000 \
            --exchange http://127.0.0.1:8010 --journal-db /tmp/ci-journal.db \
            > /tmp/ci-dashboard.log 2>&1 &
          echo $! > /tmp/ci-dashboard.pid
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/api/health; then
              echo "dashboard is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::dashboard never became healthy"
          cat /tmp/ci-upstream.log /tmp/ci-dashboard.log
          exit 1
      - name: create short-lived UI probe owner
        run: >-
          NBX_AUTH_DB=/tmp/ci-auth.db PYTHONPATH=server python3 -c
          "import auth; auth.create_user('ci-owner', 'CI-browser-probe-password-2026!', role='owner')"
      # jsdom and the real browser use the same human session contract. The
      # harness carries cookies through jsdom's jar; no protected API is bypassed.
      - name: ui smoke — jsdom
        env:
          SMOKE_USERNAME: ci-owner
          SMOKE_PASSWORD: CI-browser-probe-password-2026!
        run: |
          python3 scripts/ui_smoke_prep.py
          node scripts/ui_smoke_test.js
      - name: classifier self-test
        run: python3 scripts/probe_live.py --selftest
      # No number in the name: the probe decides how many panels exist, and a
      # hardcoded count goes stale the moment one is added or removed. The real
      # number is derived from the probe's own output and published to the run
      # summary below, so it cannot drift from what was actually verified.
      - name: every panel explains itself
        run: >-
          python3 scripts/probe_live.py --url http://127.0.0.1:8000
          --username ci-owner --password 'CI-browser-probe-password-2026!'
          --json probe-panels.json
      - name: publish the panel count to the run summary
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path

          p = Path("probe-panels.json")
          if not p.exists():
              raise SystemExit("the probe wrote no JSON; the panel step never ran")
          d = json.loads(p.read_text(encoding="utf-8"))
          bad = [r for r in d["panels"] if not r["ok"]]
          print("### Panel contract")
          print()
          print(f"- panels verified: **{len(d['panels'])}**")
          print(f"- cross-checked against the API: **{len(d.get('cross_checks', []))}**")
          print(f"- problems: **{len(bad)}**")
          if bad:
              print()
              for r in bad:
                  print(f"- `{r['tab']}/{r['panel']}` — {r['detail']}")
          PY
      - name: stop fixture servers
        if: always()
        run: |
          kill "$(cat /tmp/ci-dashboard.pid)" "$(cat /tmp/ci-upstream.pid)" 2>/dev/null || true
          tail -20 /tmp/ci-dashboard.log || true
