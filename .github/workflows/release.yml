name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  actions: read   # the release guard reads the CI conclusion for the tagged commit

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must point at main and its CI must be green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main"; exit 1
          fi
          # Lesson 3 (9 Nov): a red main was tagged once. Ask the API for the CI
          # conclusion on this exact commit; anything but success blocks the release.
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')"
          echo "ci on ${sha:0:7}: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI on ${sha:0:7} is '${conclusion}', not success — fix main, re-tag"; exit 1
          fi
      # jsdom 30 pulls undici 8, which needs zlib.createZstdDecompress.
      # That only exists on Node >= 22.22.2; 24 is the supported LTS.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-fund
      - name: npm advisories
        run: npm audit --audit-level=high
      - run: python -m pip install -r server/requirements-dev.txt
      - run: npm run build
      - name: Require a current generated dashboard
        run: git diff --exit-code -- index.html nobitex-mobile.html assets/css/tailwind.css
      - name: Validate tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py --tag "$RELEASE_TAG"
      - run: ruff check server scripts
      - run: mypy
      - run: pip-audit -r server/requirements.txt --progress-spinner off
      - run: python -m pytest -q server/tests
      - run: npm run lint
      - run: npm run lint:dashboard
      - run: npm run test:js
      - name: price ticks and decimal rounding — Python / JavaScript
        run: node scripts/test_tick_parity.js
      - run: npm run test:icons
      - run: npm run test:escaping
      - name: Viewer notice is independent of upstream health
        run: npm run test:readonly-banner
      - name: Mobile bottom nav keeps named icons; timeframe chips render
        run: npm run test:mobile-nav
      - name: Price alert bell roles, CSRF, races and standalone parity
        run: npm run test:price-alerts
      - run: npm run test:signal-detail
      - run: npm run test:signal-card
      - run: npm run test:live-candles
      - run: npm run test:queue
      - run: npm run test:lock
      - run: python scripts/check_preflight_parity.py
      - run: npm run test:display
      - run: npm run test:adaptive-card

  publish:
    name: Publish GitHub Release
    needs: validate
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Publish notes and standalone mobile download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_notes.py --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          cp nobitex-mobile.html "$RUNNER_TEMP/nobitrader-mobile.html"
          # Publishing has to converge, not collide. A re-run of this workflow —
          # or a release already created by hand — used to die on "already
          # exists", which turned a recoverable GitHub hiccup into a permanent
          # red run. The tag is still verified either way: the release may only
          # describe a tag that already points at this commit.
          # `gh release edit` has no --verify-tag, so the check is done here and
          # applies to both paths: the release may only describe a tag that
          # already points at the commit this run checked out.
          git tag --points-at HEAD | grep -qx "$RELEASE_TAG" || {
            echo "::error::tag $RELEASE_TAG does not point at HEAD"; exit 1; }
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "nobitrader $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/nobitrader-mobile.html" --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/nobitrader-mobile.html" \
              --verify-tag --title "nobitrader $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
