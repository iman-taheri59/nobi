name: Deploy

# Manual only. A push never deploys; a human presses the button and names the
# tag they are about to put on the box. Stays that way until the 12 Nov decision
# and after: production restarts are an explicit act, not a side effect.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (must already exist, e.g. v2.5.1)"
        required: true
      dry_run:
        description: "Only show what would land (update_arvan.sh --check)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }} to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Tag must point at main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ inputs.tag }}" origin/main; then
            echo "::error::${{ inputs.tag }} is not on main"; exit 1
          fi
          # `|| true` made this line decorative: a tag that did not match the
          # VERSION file deployed happily and the release notes then described
          # a version the service was not running. The workflow waits for
          # production, so a mismatch must stop the deploy, not be swallowed.
          want="${GITHUB_REF_NAME#v}"
          have="$(cat VERSION)"
          if [ "$have" != "$want" ]; then
            echo "::error::VERSION says $have but the tag is $want"
            exit 1
          fi
          echo "deploying $(git rev-parse --short HEAD) ($(cat VERSION))"

      - name: SSH setup
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KH: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" || { echo "::error::DEPLOY_SSH_KEY is empty"; exit 1; }
          test -n "$KH"  || { echo "::error::DEPLOY_KNOWN_HOSTS is empty"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KH"  > ~/.ssh/known_hosts  && chmod 644 ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/config

      - name: Remember the commit this deploy validated
        # The post-deploy proof compares the box against this number, not against
        # a version string alone. `workflow_dispatch` checks out the *tag*, so
        # HEAD here is the commit the tag names.
        id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reachability and current version
        run: |
          ssh prod 'hostname; cat /opt/nobi/VERSION; systemctl is-active nobi'

      - name: Dry run
        if: ${{ inputs.dry_run }}
        # Same dispatch as the real update, with `--check` instead of `--yes`.
        # This step carried the same `--ref` that the old script refuses, so a
        # dry run would have died exactly where the update did — and a dry run
        # exists to find that out before the update does.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          ssh prod 'bash -s' <<'REMOTE'
          set -eu
          flags="--check"
          if grep -q -- "--accept-unit-change)" /opt/nobi/scripts/update_arvan.sh; then
            flags="$flags --ref $TAG"
          fi
          echo "running: update_arvan.sh $flags"
          sudo -n bash /opt/nobi/scripts/update_arvan.sh $flags
          REMOTE

      - name: Update
        if: ${{ !inputs.dry_run }}
        # The script that runs is the one already on the box — an *older*
        # version of it, by definition. The 2.5.8 workflow called it with --ref
        # and --accept-unit-change, which v2.5.6's case-loop answers with
        # `die "unknown argument"`; the update never started and the release
        # looked like a code failure. A bootstrap problem cannot be solved by
        # the new flags themselves, so the flag set is chosen by reading the
        # installed file: if it knows the flags, use them; if it does not, say
        # so in the log and fall back to the contract it does understand.
        #
        # --ref is what makes the tag check above mean something: without it the
        # script installs origin/main, which is not necessarily the commit the
        # workflow just validated. That is why the post-deploy proof below also
        # compares the checkout's commit, not just the version.
        # --accept-unit-change: a tag that changes deploy/nobi.service or the
        # root helpers is meant to install them. The flag exists so that an
        # *ordinary* update cannot, because the checkout is owned by the service
        # user and a file there is not evidence of what root should run.
        env:
          TAG: ${{ inputs.tag }}
        # Written as one POSIX script with no GitHub expressions inside, so the
        # quoting is the shell's problem and not a second quoting layer's.
        run: |
          ssh prod 'bash -s' <<'REMOTE'
          set -eu
          tag="$TAG"
          flags="--yes --backup --verify"
          # The case *arm*, not the word: a comment that mentions the flag is not
          # an argument parser that accepts it.
          if grep -q -- "--accept-unit-change)" /opt/nobi/scripts/update_arvan.sh; then
            echo "the installed update script knows --ref and --accept-unit-change"
            flags="$flags --accept-unit-change --ref $tag"
          else
            echo "::warning::the installed update script predates --ref; this run installs origin/main."
            echo "the commit check in the next step still has to pass"
          fi
          echo "running: update_arvan.sh $flags"
          # shellcheck disable=SC2086  # the flag list is built here on purpose
          sudo -n bash /opt/nobi/scripts/update_arvan.sh $flags
          REMOTE

      - name: Post-deploy proof
        # Runs even when --verify went red (9 Nov: a probe-only 403 hid the fact
        # that the update had completed and the new version was serving).
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          ssh prod 'curl -fsS http://127.0.0.1:8000/api/health' | python3 -c '
          import json,sys; h=json.load(sys.stdin)
          print("version", h["version"], "ok", h["ok"])
          want="${{ inputs.tag }}".lstrip("v")
          sys.exit(0 if h["version"]==want and h["ok"] else 1)'
          ssh prod 'systemctl show nobi -p ActiveEnterTimestamp -p NRestarts'

      - name: The checkout is the commit this run validated
        # The version string alone cannot tell a tagged commit from a merge that
        # happens to carry the same VERSION. When the old-script fallback above
        # ran, this is the only thing standing between "validated v2.5.8" and
        # "installed whatever main was at that second".
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          head="$(ssh prod 'git -C /opt/nobi rev-parse HEAD 2>/dev/null || true')"
          want="${{ steps.tag.outputs.sha }}"
          if [ -z "$head" ]; then
            echo "::warning::could not read the checkout's commit on the box (ownership-safe git unavailable);"
            echo "the version assertion in the previous step is the only proof this run has"
          elif [ "$head" != "$want" ]; then
            echo "::error::/opt/nobi is at $head but this run validated $want"
            exit 1
          else
            echo "/opt/nobi is at $head, the commit ${{ inputs.tag }} names"
          fi
