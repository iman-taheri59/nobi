name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        run: |
          eval $(ssh-agent -s)
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection to server
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH connection OK'"

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd ~/nobi
            echo "=== Pulling latest changes ==="
            git pull origin main
            echo "=== Installing Node.js dependencies ==="
            npm ci --ignore-scripts
            echo "=== Installing Python dependencies ==="
            pip install -r server/requirements-dev.txt
            echo "=== Building frontend ==="
            npm run build
            echo "=== Restarting service (uncomment and adjust for your server) ==="
            # sudo systemctl restart nobi
            echo "Deploy completed successfully."
          EOF
