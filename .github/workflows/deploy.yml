name: Deploy

# Manual only. A push never deploys; a human presses the button and names the
# tag they are about to put on the box. Stays that way until the 12 Nov decision
# and after: production restarts are an explicit act, not a side effect.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (must already exist, e.g. v2.5.1)"
        required: true
      dry_run:
        description: "Only show what would land (update_arvan.sh --check)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }} to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Tag must point at main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ inputs.tag }}" origin/main; then
            echo "::error::${{ inputs.tag }} is not on main"; exit 1
          fi
          # `|| true` made this line decorative: a tag that did not match the
          # VERSION file deployed happily and the release notes then described
          # a version the service was not running. The workflow waits for
          # production, so a mismatch must stop the deploy, not be swallowed.
          # `GITHUB_REF_NAME` was the wrong variable: a workflow_dispatch run
          # has no tag to name, so it held the *branch* ("main") and the check
          # compared 2.5.8 with main and failed — every manual deploy died here
          # before SSH, including the 2.5.8 one on 14 Nov, which reported
          # "VERSION says 2.5.8 but the tag is main". The tag is an input, not
          # the ref this workflow was triggered on.
          want="${TAG#v}"
          have="$(cat VERSION)"
          if [ "$have" != "$want" ]; then
            echo "::error::VERSION says $have but the tag is $want"
            exit 1
          fi
          echo "deploying $(git rev-parse --short HEAD) ($(cat VERSION))"

      - name: SSH setup
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KH: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" || { echo "::error::DEPLOY_SSH_KEY is empty"; exit 1; }
          test -n "$KH"  || { echo "::error::DEPLOY_KNOWN_HOSTS is empty"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KH"  > ~/.ssh/known_hosts  && chmod 644 ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/config

      - name: Remember the commit this deploy validated
        # The post-deploy proof compares the box against this number, not against
        # a version string alone. `workflow_dispatch` checks out the *tag*, so
        # HEAD here is the commit the tag names.
        id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reachability and current version
        run: |
          ssh prod 'hostname; cat /opt/nobi/VERSION; systemctl is-active nobi'

      - name: Dry run
        if: ${{ inputs.dry_run }}
        # Same dispatch as the real update, with `--check` instead of `--yes`, so
        # a dry run dies exactly where the update would.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # `env:` sets TAG for this *runner* step; ssh starts a fresh environment
          # on the box, so the value travels as text -- expanded here, quoted for
          # the remote shell, and read there as `$1`. Reading `$TAG` inside the
          # heredoc is what made 2.5.8's deploy die with `TAG: unbound variable`.
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a release tag: $TAG"; exit 1 ;;
          esac
          # ------------------------------------------------------------------ #
          # Which script runs, and which flags it gets
          # ------------------------------------------------------------------ #
          # 1. The script on the box is the PREVIOUS release's: deploy.yml is read
          #    from main on every run, update_arvan.sh from /opt/nobi, and only a
          #    successful deploy changes the second. Four red runs were spent
          #    fixing a file the box never read.
          # 2. The deploy account cannot rewrite /opt/nobi: `sudo install` there
          #    answers "a password is required" (17 Nov). That boundary stays --
          #    a deploy key that can overwrite root-owned files is the bigger
          #    risk -- so this run's script is staged in a directory the account
          #    owns and run from there, with the old one kept beside it.
          # 3. Which flags it accepts is asked of that file, on the box, with its
          #    answer captured here. It cannot be computed inside the heredoc
          #    below: a heredoc is stdin, and stdin is read once.
          if [ -f scripts/update_arvan.sh ]; then
            if ssh prod 'mkdir -p ~/nobi-deploy/scripts' \
               && ssh prod 'cat > ~/nobi-deploy/scripts/update_arvan.sh' < scripts/update_arvan.sh \
               && ssh prod 'chmod 755 ~/nobi-deploy/scripts/update_arvan.sh' \
               && ssh prod 'cp /opt/nobi/scripts/update_arvan.sh ~/nobi-deploy/previous-update_arvan.sh 2>/dev/null || true'
            then
              echo "this run's script: $(sha256sum < scripts/update_arvan.sh | cut -c1-12) staged at ~/nobi-deploy/scripts/update_arvan.sh"
              # Single quotes: the runner must NOT expand this. The remote shell
              # expands $HOME, which is the deploy account's home on the box.
              RUN_SCRIPT='$HOME/nobi-deploy/scripts/update_arvan.sh'
            else
              echo "::warning::could not stage this run's update script; using the one on the box"
              RUN_SCRIPT=/opt/nobi/scripts/update_arvan.sh
            fi
          else
            RUN_SCRIPT=/opt/nobi/scripts/update_arvan.sh
          fi
          # `printf %q` of a literal `$HOME/...` yields `\$HOME/...`: the outer
          # double quotes expand `\$` to a plain `$`, the remote shell expands it
          # once. Passing the *staged* path unexpanded is what keeps the runner
          # from looking for the deploy account's home on its own disk.
          caps="$(ssh prod "bash -s -- $RUN_SCRIPT" <<'PROBE'
          set -eu
          installed="$1"
          if body="$(sudo -n -u nobi cat "$installed" 2>/dev/null)" && [ -n "$body" ]; then
            echo "reading $installed as nobi" >&2
          elif body="$(cat "$installed" 2>/dev/null)" && [ -n "$body" ]; then
            echo "reading $installed as $(id -un)" >&2
          else
            echo "::warning::cannot read $installed; every flag is treated as missing" >&2
            body=""
          fi
          for arm in ref accept-unit-change keep-local-edits; do
            if printf '%s' "$body" | grep -q -- "--$arm)"; then
              echo "has $arm"
            else
              echo "missing $arm"
            fi
          done
          PROBE
          )"
          # Parse with `case`, not `grep -q` in a pipe: under `pipefail` SIGPIPE
          # turns a match into 141 and a "yes" into a "no".
          CAP_REF=no; CAP_UNIT=no; CAP_KEEP=no
          while IFS= read -r line; do
            case "$line" in
              "has ref") CAP_REF=yes ;;
              "has accept-unit-change") CAP_UNIT=yes ;;
              "has keep-local-edits") CAP_KEEP=yes ;;
            esac
          done <<CAPS
          $caps
          CAPS
          echo "script under test: $RUN_SCRIPT"
          echo "flags it accepts: ref=$CAP_REF accept-unit-change=$CAP_UNIT keep-local-edits=$CAP_KEEP"
          ssh prod "bash -s -- '$TAG' $CAP_REF $CAP_UNIT $CAP_KEEP '$RUN_SCRIPT'" <<'REMOTE'
          set -eu
          tag="$1"; cap_ref="$2"; cap_unit="$3"; cap_keep="$4"; script="$5"
          flags="--check"
          # No flag reaches the command line that the parser did not admit to.
          if [ "$cap_keep" = yes ]; then
            flags="$flags --keep-local-edits"
          else
            echo "::warning::the script has no --keep-local-edits; a dirty checkout will stop this run"
          fi
          if [ "$cap_ref" = yes ]; then
            flags="$flags --ref $tag"
          else
            echo "::warning::the script has no --ref; this run installs origin/main and the commit check has to catch it"
          fi
          if [ "$cap_unit" = yes ]; then
            flags="$flags --accept-unit-change"
          else
            echo "::warning::the script has no --accept-unit-change; a unit change will not be installed"
          fi
          echo "running: $(basename "$script") $flags"
          sudo -n bash -c "bash $script $flags"
          REMOTE

      - name: Update
        if: ${{ !inputs.dry_run }}
        # A push never deploys; this step is the one a human approved.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # `env:` sets TAG for this *runner* step; ssh starts a fresh environment
          # on the box, so the value travels as text -- expanded here, quoted for
          # the remote shell, and read there as `$1`. Reading `$TAG` inside the
          # heredoc is what made 2.5.8's deploy die with `TAG: unbound variable`.
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a release tag: $TAG"; exit 1 ;;
          esac
          # ------------------------------------------------------------------ #
          # Which script runs, and which flags it gets
          # ------------------------------------------------------------------ #
          # 1. The script on the box is the PREVIOUS release's: deploy.yml is read
          #    from main on every run, update_arvan.sh from /opt/nobi, and only a
          #    successful deploy changes the second. Four red runs were spent
          #    fixing a file the box never read.
          # 2. The deploy account cannot rewrite /opt/nobi: `sudo install` there
          #    answers "a password is required" (17 Nov). That boundary stays --
          #    a deploy key that can overwrite root-owned files is the bigger
          #    risk -- so this run's script is staged in a directory the account
          #    owns and run from there, with the old one kept beside it.
          # 3. Which flags it accepts is asked of that file, on the box, with its
          #    answer captured here. It cannot be computed inside the heredoc
          #    below: a heredoc is stdin, and stdin is read once.
          if [ -f scripts/update_arvan.sh ]; then
            if ssh prod 'mkdir -p ~/nobi-deploy/scripts' \
               && ssh prod 'cat > ~/nobi-deploy/scripts/update_arvan.sh' < scripts/update_arvan.sh \
               && ssh prod 'chmod 755 ~/nobi-deploy/scripts/update_arvan.sh' \
               && ssh prod 'cp /opt/nobi/scripts/update_arvan.sh ~/nobi-deploy/previous-update_arvan.sh 2>/dev/null || true'
            then
              echo "this run's script: $(sha256sum < scripts/update_arvan.sh | cut -c1-12) staged at ~/nobi-deploy/scripts/update_arvan.sh"
              # Single quotes: the runner must NOT expand this. The remote shell
              # expands $HOME, which is the deploy account's home on the box.
              RUN_SCRIPT='$HOME/nobi-deploy/scripts/update_arvan.sh'
            else
              echo "::warning::could not stage this run's update script; using the one on the box"
              RUN_SCRIPT=/opt/nobi/scripts/update_arvan.sh
            fi
          else
            RUN_SCRIPT=/opt/nobi/scripts/update_arvan.sh
          fi
          # `printf %q` of a literal `$HOME/...` yields `\$HOME/...`: the outer
          # double quotes expand `\$` to a plain `$`, the remote shell expands it
          # once. Passing the *staged* path unexpanded is what keeps the runner
          # from looking for the deploy account's home on its own disk.
          caps="$(ssh prod "bash -s -- $RUN_SCRIPT" <<'PROBE'
          set -eu
          installed="$1"
          if body="$(sudo -n -u nobi cat "$installed" 2>/dev/null)" && [ -n "$body" ]; then
            echo "reading $installed as nobi" >&2
          elif body="$(cat "$installed" 2>/dev/null)" && [ -n "$body" ]; then
            echo "reading $installed as $(id -un)" >&2
          else
            echo "::warning::cannot read $installed; every flag is treated as missing" >&2
            body=""
          fi
          for arm in ref accept-unit-change keep-local-edits; do
            if printf '%s' "$body" | grep -q -- "--$arm)"; then
              echo "has $arm"
            else
              echo "missing $arm"
            fi
          done
          PROBE
          )"
          # Parse with `case`, not `grep -q` in a pipe: under `pipefail` SIGPIPE
          # turns a match into 141 and a "yes" into a "no".
          CAP_REF=no; CAP_UNIT=no; CAP_KEEP=no
          while IFS= read -r line; do
            case "$line" in
              "has ref") CAP_REF=yes ;;
              "has accept-unit-change") CAP_UNIT=yes ;;
              "has keep-local-edits") CAP_KEEP=yes ;;
            esac
          done <<CAPS
          $caps
          CAPS
          echo "script under test: $RUN_SCRIPT"
          echo "flags it accepts: ref=$CAP_REF accept-unit-change=$CAP_UNIT keep-local-edits=$CAP_KEEP"
          ssh prod "bash -s -- '$TAG' $CAP_REF $CAP_UNIT $CAP_KEEP '$RUN_SCRIPT'" <<'REMOTE'
          set -eu
          tag="$1"; cap_ref="$2"; cap_unit="$3"; cap_keep="$4"; script="$5"
          flags="--yes --backup --verify"
          # No flag reaches the command line that the parser did not admit to.
          if [ "$cap_keep" = yes ]; then
            flags="$flags --keep-local-edits"
          else
            echo "::warning::the script has no --keep-local-edits; a dirty checkout will stop this run"
          fi
          if [ "$cap_ref" = yes ]; then
            flags="$flags --ref $tag"
          else
            echo "::warning::the script has no --ref; this run installs origin/main and the commit check has to catch it"
          fi
          if [ "$cap_unit" = yes ]; then
            flags="$flags --accept-unit-change"
          else
            echo "::warning::the script has no --accept-unit-change; a unit change will not be installed"
          fi
          echo "running: $(basename "$script") $flags"
          sudo -n bash -c "bash $script $flags"
          REMOTE

      - name: Post-deploy proof
        # Runs even when --verify went red (9 Nov: a probe-only 403 hid the fact
        # that the update had completed and the new version was serving).
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          ssh prod 'curl -fsS http://127.0.0.1:8000/api/health' | python3 -c '
          import json,sys; h=json.load(sys.stdin)
          print("version", h["version"], "ok", h["ok"])
          want="${{ inputs.tag }}".lstrip("v")
          sys.exit(0 if h["version"]==want and h["ok"] else 1)'
          ssh prod 'systemctl show nobi -p ActiveEnterTimestamp -p NRestarts'

      - name: The checkout is the commit this run validated
        # The version string alone cannot tell a tagged commit from a merge that
        # happens to carry the same VERSION. When the old-script fallback above
        # ran, this is the only thing standing between "validated v2.5.8" and
        # "installed whatever main was at that second".
        if: ${{ !inputs.dry_run && !cancelled() }}
        run: |
          head="$(ssh prod 'git -C /opt/nobi rev-parse HEAD 2>/dev/null || true')"
          want="${{ steps.tag.outputs.sha }}"
          if [ -z "$head" ]; then
            echo "::warning::could not read the checkout's commit on the box (ownership-safe git unavailable);"
            echo "the version assertion in the previous step is the only proof this run has"
          elif [ "$head" != "$want" ]; then
            echo "::error::/opt/nobi is at $head but this run validated $want"
            exit 1
          else
            echo "/opt/nobi is at $head, the commit ${{ inputs.tag }} names"
          fi
