name: Status

# Read-only report from the production box, on demand. Nothing here writes,
# restarts, or needs the update script: health, unit state, the last log lines,
# and (optionally) the daily journal diagnostic as an artifact. Uses the same
# `production` environment as Deploy, so the same approval gate applies — no
# workflow reaches the server without a human pressing the button.
on:
  workflow_dispatch:
    inputs:
      log_lines:
        description: "journalctl lines to show"
        default: "80"
      diagnostic:
        description: "Also run scripts/journal_diagnostic.py (last 24h, with paper rejects + stop slip) and upload it"
        type: boolean
        default: true
      since:
        description: "Window start for the backfill reports (ISO, e.g. 2026-11-09T07:28:00Z). Empty = since the 2.5.2 deploy"
        default: ""
      backfills:
        description: "Also run shadow_backfill (arms + stop slip) and pump_chase_backfill over the window, as markdown artifacts"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production   # never overlap with a deploy on the same box
  cancel-in-progress: false

jobs:
  status:
    name: Production status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: SSH setup
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KH: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" || { echo "::error::DEPLOY_SSH_KEY is empty"; exit 1; }
          test -n "$KH"  || { echo "::error::DEPLOY_KNOWN_HOSTS is empty"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KH"  > ~/.ssh/known_hosts  && chmod 644 ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/config

      - name: Version and unit
        run: |
          ssh prod 'hostname; echo "VERSION  $(cat /opt/nobi/VERSION)"; echo "commit   $(git -c safe.directory=/opt/nobi -C /opt/nobi rev-parse --short HEAD) $(git -c safe.directory=/opt/nobi -C /opt/nobi describe --tags --always 2>/dev/null)";
                    systemctl show nobi -p ActiveState -p SubState -p ActiveEnterTimestamp -p NRestarts -p MainPID;
                    uptime; df -h /srv/nobi-data | tail -1'

      - name: /api/health (summary)
        run: |
          ssh prod 'curl -fsS --max-time 10 http://127.0.0.1:8000/api/health' > health.json
          python3 - <<'PY'
          import json
          h = json.load(open("health.json"))
          def g(*ks, d=None):
              cur = h
              for k in ks:
                  if not isinstance(cur, dict): return d
                  cur = cur.get(k)
              return d if cur is None else cur
          import time
          sl = h.get("scan_loop") or {}
          age = (time.time() - sl["last_completed_at"]) if sl.get("last_completed_at") else None
          rows = [
              ("version", h.get("version")), ("build", h.get("build")), ("ok", h.get("ok")),
              ("upstream.ok", g("upstream", "ok")), ("upstream.checked_at", g("upstream", "checked_at")),
              ("stats.ok / fail / total", f'{g("stats","ok")} / {g("stats","fail")} / {g("stats","total")}'),
              ("stats.success_rate", g("stats", "success_rate")),
              ("scan_loop.last_ok", sl.get("last_ok")), ("scan_loop.runs", sl.get("runs")),
              ("scan_loop.last_scored", sl.get("last_scored")),
              ("scan_loop.last_completed (s ago)", None if age is None else round(age)),
              ("scan_loop.error", sl.get("error")),
              ("market_regime.state", g("market_regime", "state")),
              ("mode", h.get("mode")),
          ]
          w = max(len(k) for k, _ in rows)
          for k, v in rows:
              print(f"  {k:<{w}}  {v}")
          bad = [k for k, v in rows if k in ("ok", "upstream.ok", "scan_loop.last_ok") and v is False]
          if bad:
              print(f"::warning::health reports {', '.join(bad)} = false")
          PY

      - name: /api/health (full)
        run: python3 -m json.tool health.json

      - name: Last log lines (without httpx request noise)
        continue-on-error: true
        run: |
          ssh prod "sudo -n journalctl -u nobi -n 2000 --no-pager -o short-iso 2>&1 | grep -v 'INFO:httpx:HTTP Request' | grep -v '\"GET /api/' | tail -n ${{ inputs.log_lines }}"

      - name: Last log lines (raw)
        continue-on-error: true
        run: |
          # An unprivileged user gets "-- No entries --" for a system unit, not an
          # error, so sudo goes first and plain journalctl is the fallback.
          ssh prod "sudo -n journalctl -u nobi -n ${{ inputs.log_lines }} --no-pager -o short-iso 2>&1 || journalctl -u nobi -n ${{ inputs.log_lines }} --no-pager -o short-iso 2>&1 || true"

      - name: Daily diagnostic
        continue-on-error: true
        if: ${{ inputs.diagnostic }}
        run: |
          SINCE="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          # Read-only: the script opens the journal with sqlite in read mode and
          # only reads paper_state.json. Try the service user first (stderr kept,
          # so a script error is not mistaken for a permission problem).
          # Invoked as an explicit path (no bash -c wrapper) so it matches a narrow
          # sudoers rule: deploy ALL=(nobi) NOPASSWD: /opt/nobi/.venv/bin/python /opt/nobi/scripts/journal_diagnostic.py *
          ssh prod "PY=/opt/nobi/.venv/bin/python; S=/opt/nobi/scripts/journal_diagnostic.py; DB=/srv/nobi-data/journal.db; PS=/srv/nobi-data/paper_state.json;
                    if sudo -n -u nobi \$PY \$S \$DB --since $SINCE --paper \$PS 2>&1; then :;
                    elif [ -r \$DB ]; then \$PY \$S \$DB --since $SINCE --paper \$PS 2>&1;
                    else echo 'journal.db not readable by deploy and sudo -u nobi refused:'; ls -l \$DB \$PS; id; sudo -n -l 2>&1 | tail -5; fi" \
            | tee diagnostic.txt

      - name: State files
        continue-on-error: true
        run: |
          ssh prod 'sudo -n -u nobi /usr/bin/ls -l --time-style=+%Y-%m-%dT%H:%M:%SZ /srv/nobi-data/ /srv/nobi-data/backup/ 2>&1 | grep -v "^total" | head -40; echo; sudo -n -u nobi /usr/bin/du -sh /srv/nobi-data 2>&1'

      - name: Paper book
        continue-on-error: true
        run: |
          ssh prod 'sudo -n -u nobi /opt/nobi/.venv/bin/python /opt/nobi/scripts/paper_state_summary.py /srv/nobi-data/paper_state.json --events 20 2>&1' | tee paper_book.txt

      - name: Holdout cutoff (ADR-0052)
        run: |
          # `show` exits 1 while the cutoff is not frozen; that is information, not a failure.
          ssh prod 'cd /opt/nobi && sudo -n -u nobi /opt/nobi/.venv/bin/python /opt/nobi/scripts/journal_holdout.py show --db /srv/nobi-data/journal.db 2>&1' || echo "::warning::holdout cutoff is not frozen (ADR-0052 cutoff: 2026-11-10T07:20:00Z)"

      - name: Shadow arms + stop slip over the window (shadow_backfill)
        continue-on-error: true
        if: ${{ inputs.backfills }}
        run: |
          SINCE="${{ inputs.since }}"; SINCE="${SINCE:-2026-11-09T07:28:00Z}"
          echo "window since $SINCE"
          ssh prod "cd /opt/nobi && sudo -n -u nobi /opt/nobi/.venv/bin/python /opt/nobi/scripts/shadow_backfill.py /srv/nobi-data/journal.db --since $SINCE --paper /srv/nobi-data/paper_state.json 2>&1" | tee shadow_backfill.md

      - name: Chase-the-pump / depth over the window (pump_chase_backfill)
        continue-on-error: true
        if: ${{ inputs.backfills }}
        run: |
          SINCE="${{ inputs.since }}"; SINCE="${SINCE:-2026-11-09T07:28:00Z}"
          ssh prod "cd /opt/nobi && sudo -n -u nobi /opt/nobi/.venv/bin/python /opt/nobi/scripts/pump_chase_backfill.py /srv/nobi-data/journal.db --since $SINCE 2>&1" | tee pump_chase.md

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-status-${{ github.run_id }}
          path: |
            health.json
            diagnostic.txt
            paper_book.txt
            shadow_backfill.md
            pump_chase.md
          if-no-files-found: ignore
          retention-days: 14
